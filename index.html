different \u2018feminine t\u2019s.** Nouns take \u0629 (tied because the two dots sit on a closed loop); past verbs take a silent \u062A (\u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652). They look different because they behave differently: \u0629 changes to \u0640\u0647 at a pause, while the verb\u2019s \u062A is always pronounced.

**Why \u0629 becomes \u0640\u0647.** At a pause (\u0627\u0644\u0648\u0642\u0641) Arabic drops the final vowel, and the t\u0101\u02BE marb\u016B\u1E6Dah turns into a soft \u0640\u0647: \u0645\u064E\u062F\u0652\u0631\u064E\u0633\u064E\u0647\u0652. When the word connects to what follows (\u0627\u0644\u0648\u0635\u0644), the t returns: \u0645\u064E\u062F\u0652\u0631\u064E\u0633\u064E\u0629\u064F \u0627\u0644\u0628\u064E\u0646\u0650\u064A\u0646\u064E. You\u2019ll study \u0627\u0644\u0648\u0642\u0641 in Subject 2.4.`},{kind:"text",heading:"Egyptian bridge",body:`You already use the pause/connect rule for \u0629 without knowing it. Egyptian says \u0639\u0631\u0628\u064A\u0629 (\u02BFarabiyya) alone but \u0639\u0631\u0628\u064A\u0629 \u0645\u062D\u0645\u062F as \u02BFarabiyyit Mu\u1E25ammad: the \u062A reappears exactly when the word is joined to the next one in i\u1E0D\u0101fah. That\u2019s the Fu\u1E63\u1E25\u0101 \u0648\u0635\u0644 rule surviving in Egyptian.

Egyptian keeps the unmarked feminines too: \u0627\u0644\u0634\u0645\u0633 \u0637\u0627\u0644\u0639\u0629\u060C \u0627\u0644\u0623\u0631\u0636 \u0645\u0628\u0644\u0648\u0644\u0629.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0642\u064E\u0627\u0644\u064E\u062A\u0650 \u0627\u0644\u0652\u0623\u064E\u0639\u0652\u0631\u064E\u0627\u0628\u064F \u0622\u0645\u064E\u0646\u064E\u0651\u0627\uFD3E",ref:"S\u016Brat al-\u1E24ujur\u0101t 49:14 (opening)",en:"The Bedouins say, \u2018We have believed.\u2019",note:"\u0642\u0627\u0644\u064E\u062A\u0652 carries \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B (its suk\u016Bn becomes kasrah to join the next word). A broken plural subject allows a feminine verb."},{ar:"\uFD3F\u0648\u064E\u0627\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u0650 \u0648\u064E\u0636\u064F\u062D\u064E\u0627\u0647\u064E\u0627\uFD3E",ref:"S\u016Brat ash-Shams 91:1",en:"By the sun and its morning brightness.",note:"The pronoun \u0640\u0647\u0627 refers back to \u0627\u0644\u0634\u064E\u0651\u0645\u0652\u0633: feminine without a marker."}]}],exercises:[{type:"mcq",prompt:"Which noun is feminine with no written marker?",options:["\u0623\u064E\u0631\u0652\u0636","\u0637\u0627\u0644\u0650\u0628\u064E\u0629","\u0635\u064E\u062D\u0652\u0631\u0627\u0621","\u0643\u064F\u0628\u0652\u0631\u064E\u0649"],answer:0,explanation:"\u0623\u064E\u0631\u0652\u0636 is \u0645\u0624\u0646\u062B \u0645\u0639\u0646\u0648\u064A."},{type:"mcq",prompt:"Complete: \u0627\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F \u2026",options:["\u0633\u0627\u0637\u0650\u0639\u064E\u0629\u064C","\u0633\u0627\u0637\u0650\u0639\u064C","\u0633\u0627\u0637\u0650\u0639\u064F\u0648\u0646\u064E","\u0633\u0627\u0637\u0650\u0639\u0627\u0646\u0650"],answer:0,explanation:"\u0634\u0645\u0633 is feminine, so the khabar takes \u0629."},{type:"type",prompt:"The silent feminine \u062A on a past verb (\u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652). What is the Arabic term?",answers:["\u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629","\u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B"],explanation:"\u062A\u0627\u0621 \u0627\u0644\u062A\u064E\u0651\u0623\u0652\u0646\u0650\u064A\u062B \u0627\u0644\u0633\u0651\u0627\u0643\u0650\u0646\u064E\u0629."},{type:"mcq",prompt:"\u0633\u064E\u064A\u0651\u0627\u0631\u064E\u0629 (car) is:",options:["\u0645\u0624\u0646\u062B \u0645\u062C\u0627\u0632\u064A","\u0645\u0624\u0646\u062B \u062D\u0642\u064A\u0642\u064A","\u0645\u0630\u0643\u0631","\u0645\u062B\u0646\u0649"],answer:0,explanation:"Grammatically feminine, not biologically."},{type:"mcq",prompt:"Why does Egyptian say \u02BFarabiyyit Mu\u1E25ammad?",options:["The \u0629 is pronounced as \u062A when connected to the next word","It\u2019s a plural","It\u2019s a verb","It\u2019s a mistake"],answer:0,explanation:"The \u0648\u0635\u0644 rule: t\u0101\u02BE marb\u016B\u1E6Dah is heard as t when joined."},{type:"open",prompt:"Give the feminine of these: \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064C\u060C \u0643\u064E\u0628\u0650\u064A\u0631\u064C\u060C \u0637\u0627\u0644\u0650\u0628\u064C. What marker did you use?",model:"\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064E\u0629\u064C\u060C \u0643\u064E\u0628\u0650\u064A\u0631\u064E\u0629\u064C\u060C \u0637\u0627\u0644\u0650\u0628\u064E\u0629\u064C: all with \u0627\u0644\u062A\u0627\u0621 \u0627\u0644\u0645\u0631\u0628\u0648\u0637\u0629."}],review:[{type:"mcq",prompt:"\u0627\u0644\u0623\u064E\u0644\u0650\u0641 \u0627\u0644\u0645\u064E\u0642\u0652\u0635\u064F\u0648\u0631\u064E\u0629 appears in:",options:["\u0643\u064F\u0628\u0652\u0631\u064E\u0649","\u0635\u064E\u062D\u0652\u0631\u0627\u0621","\u0634\u064E\u062C\u064E\u0631\u064E\u0629","\u0634\u064E\u0645\u0652\u0633"],answer:0,explanation:""},{type:"type",prompt:"Feminine. What is the Arabic term?",answers:["\u0645\u0624\u0646\u062B","\u0627\u0644\u0645\u0624\u0646\u062B"],explanation:"\u0645\u064F\u0624\u064E\u0646\u064E\u0651\u062B."}]},"1.6":{sections:[{kind:"text",heading:"The idea",body:"A noun either points to something specific and known to the listener (**\u0645\u064E\u0639\u0652\u0631\u0650\u0641\u064E\u0629**) or to one of a kind, unspecified (**\u0646\u064E\u0643\u0650\u0631\u064E\u0629**). English marks this with \u2018the\u2019 and \u2018a\u2019. Arabic marks nakirah with tanw\u012Bn and ma\u02BFrifah in six ways, only one of which is \u0627\u0644."},{kind:"table",heading:"The kinds of ma\u02BFrifah (\u0627\u0644\u0645\u064E\u0639\u0627\u0631\u0650\u0641)",head:["Kind","Example"],rows:[["\u0627\u0644\u0636\u064E\u0651\u0645\u0650\u064A\u0631 (pronoun)","\u0623\u064E\u0646\u0627\u060C \u0647\u064F\u0648\u064E\u060C \u0640\u0643\u064E"],["\u0627\u0644\u0639\u064E\u0644\u064E\u0645 (proper name)","\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C\u060C \u0645\u064E\u0643\u064E\u0651\u0629\u064F\u060C \u0645\u0650\u0635\u0652\u0631\u064F"],["\u0627\u0633\u0652\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u064E\u0629 (demonstrative)","\u0647\u0670\u0630\u0627\u060C \u062A\u0650\u0644\u0652\u0643\u064E"],["\u0627\u0644\u0627\u0633\u0652\u0645 \u0627\u0644\u0645\u064E\u0648\u0652\u0635\u064F\u0648\u0644 (relative)","\u0627\u0644\u064E\u0651\u0630\u0650\u064A\u060C \u0627\u0644\u064E\u0651\u062A\u0650\u064A"],["\u0627\u0644\u0645\u064F\u0639\u064E\u0631\u064E\u0651\u0641 \u0628\u0650\u0623\u064E\u0644","\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F"],["\u0627\u0644\u0645\u064F\u0636\u0627\u0641 \u0625\u0644\u0649 \u0645\u064E\u0639\u0652\u0631\u0650\u0641\u064E\u0629","\u0643\u0650\u062A\u0627\u0628\u064F \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u0650\u060C \u0643\u0650\u062A\u0627\u0628\u0650\u064A"],["\u0627\u0644\u0645\u064F\u0646\u0627\u062F\u064E\u0649 \u0627\u0644\u0645\u064E\u0642\u0652\u0635\u064F\u0648\u062F (a specific person called)","\u064A\u0627 \u0631\u064E\u062C\u064F\u0644\u064F (to a particular man)"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0646\u064E\u0643\u0650\u0631\u064E\u0629",tr:"nakirah",en:"indefinite"},{ar:"\u0645\u064E\u0639\u0652\u0631\u0650\u0641\u064E\u0629",tr:"ma\u02BFrifah",en:"definite"},{ar:"\u0627\u0644\u0645\u064E\u0639\u0627\u0631\u0650\u0641",tr:"al-ma\u02BF\u0101rif",en:"the kinds of definite nouns"},{ar:"\u0627\u0644\u0639\u064E\u0644\u064E\u0645",tr:"al-\u02BFalam",en:"proper name"},{ar:"\u0627\u0644\u0645\u064F\u0639\u064E\u0631\u064E\u0651\u0641 \u0628\u0650\u0623\u064E\u0644",tr:"al-mu\u02BFarraf bi-al",en:"made definite by \u0627\u0644"},{ar:"\u0627\u0644\u062A\u064E\u0651\u0639\u0652\u0631\u0650\u064A\u0641 / \u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0643\u0650\u064A\u0631",tr:"at-ta\u02BFr\u012Bf / at-tank\u012Br",en:"definiteness / indefiniteness"}]},{kind:"examples",heading:"Examples",items:[{ar:"\u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F {n:\u0631\u064E\u062C\u064F\u0644\u064B\u0627}",eg:"\u0634\u0641\u062A \u0631\u0627\u062C\u0644",en:"I saw a man.",note:"Tanw\u012Bn \u2192 nakirah."},{ar:"\u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F {n:\u0627\u0644\u0631\u064E\u0651\u062C\u064F\u0644\u064E}",eg:"\u0634\u0641\u062A \u0627\u0644\u0631\u0627\u062C\u0644",en:"I saw the man.",note:"\u0627\u0644 \u2192 ma\u02BFrifah; tanw\u012Bn disappears."},{ar:"\u0647\u0670\u0630\u0627 \u0643\u0650\u062A\u0627\u0628\u064F \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u0650",eg:"\u062F\u0647 \u0643\u062A\u0627\u0628 \u0627\u0644\u0637\u0627\u0644\u0628",en:"This is the student\u2019s book.",note:"\u0643\u0650\u062A\u0627\u0628\u064F has no \u0627\u0644 but is ma\u02BFrifah through i\u1E0D\u0101fah to a ma\u02BFrifah."},{ar:"\u062C\u0627\u0621\u064E {r:\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C}",eg:"\u0645\u062D\u0645\u062F \u062C\u0647",en:"Mu\u1E25ammad came.",note:"A name can carry tanw\u012Bn and still be ma\u02BFrifah (\u0639\u064E\u0644\u064E\u0645)."}]},{kind:"text",heading:"Why it works this way",body:`**\u0627\u0644 and tanw\u012Bn exclude each other** because they send opposite signals. On common nouns, tanw\u012Bn lines up with \u2018one of a kind\u2019, and \u0627\u0644 makes the noun specific, so the tanw\u012Bn has to go. (Technically the ordinary tanw\u012Bn, \u062A\u064E\u0646\u0652\u0648\u0650\u064A\u0646 \u0627\u0644\u062A\u064E\u0651\u0645\u0652\u0643\u0650\u064A\u0646, marks a fully declinable noun, which is why a name like \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C has it while being ma\u02BFrifah. Subject 2.3 covers the kinds of tanw\u012Bn.)

**Why this matters for grammar.** Definiteness drives structure. The mubtada\u02BE is normally ma\u02BFrifah (\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F \u062C\u064E\u062F\u0650\u064A\u062F\u064C), while a nakirah generally can\u2019t start a sentence without help, so Arabic fronts the predicate: \u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 \u0631\u064E\u062C\u064F\u0644\u064C (\u2018there is a man in the house\u2019). And an adjective must match its noun in definiteness (Chapter 3): \u0643\u0650\u062A\u0627\u0628\u064C \u062C\u064E\u062F\u0650\u064A\u062F\u064C / \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F \u0627\u0644\u062C\u064E\u062F\u0650\u064A\u062F\u064F.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian marks definiteness the same way with \u0627\u0644, but has no audible tanw\u012Bn, so an indefinite noun is just bare: \u0643\u062A\u0627\u0628. Egyptian sometimes uses \u0648\u0627\u062D\u062F / \u0648\u0627\u062D\u062F\u0629 as an informal \u2018a\u2019: \u0648\u0627\u062D\u062F \u0635\u0627\u062D\u0628\u064A (a friend of mine).

The \u2018there is\u2019 construction survives too: \u0641\u064A \u0631\u0627\u062C\u0644 \u0641\u064A \u0627\u0644\u0628\u064A\u062A echoes Fu\u1E63\u1E25\u0101 \u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 \u0631\u064E\u062C\u064F\u0644\u064C.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0643\u064E\u0645\u064E\u0627 \u0623\u064E\u0631\u0652\u0633\u064E\u0644\u0652\u0646\u064E\u0627 \u0625\u0650\u0644\u064E\u0649\u0670 \u0641\u0650\u0631\u0652\u0639\u064E\u0648\u0652\u0646\u064E \u0631\u064E\u0633\u064F\u0648\u0644\u064B\u0627 \u06DD \u0641\u064E\u0639\u064E\u0635\u064E\u0649\u0670 \u0641\u0650\u0631\u0652\u0639\u064E\u0648\u0652\u0646\u064F \u0627\u0644\u0631\u064E\u0651\u0633\u064F\u0648\u0644\u064E\uFD3E",ref:"S\u016Brat al-Muzzammil 73:15\u201316",en:"\u2026just as We sent to Pharaoh a messenger. But Pharaoh disobeyed the messenger.",note:"First mention: \u0631\u064E\u0633\u064F\u0648\u0644\u064B\u0627, nakirah with tanw\u012Bn. Second mention of the same person: \u0627\u0644\u0631\u064E\u0651\u0633\u064F\u0648\u0644\u064E, ma\u02BFrifah with \u0627\u0644. Exactly like English \u2018a messenger \u2026 the messenger\u2019."}]}],exercises:[{type:"mcq",prompt:"\u0643\u0650\u062A\u0627\u0628\u064F \u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0650: is \u0643\u0650\u062A\u0627\u0628\u064F nakirah or ma\u02BFrifah?",options:["\u0645\u064E\u0639\u0652\u0631\u0650\u0641\u064E\u0629 (by i\u1E0D\u0101fah)","\u0646\u064E\u0643\u0650\u0631\u064E\u0629 (no \u0627\u0644)"],answer:0,explanation:"It is made definite by being \u0645\u0636\u0627\u0641 to a ma\u02BFrifah."},{type:"mcq",prompt:"Which is a nakirah?",options:["\u0628\u064E\u064A\u0652\u062A\u064C","\u0647\u0670\u0630\u0627","\u0645\u064E\u0643\u064E\u0651\u0629\u064F","\u0623\u064E\u0646\u0652\u062A\u064E"],answer:0,explanation:"Tanw\u012Bn, no other definiteness."},{type:"type",prompt:"A proper name, one kind of ma\u02BFrifah. What is the Arabic term?",answers:["\u0627\u0644\u0639\u0644\u0645","\u0639\u0644\u0645"],explanation:"\u0627\u0644\u0639\u064E\u0644\u064E\u0645."},{type:"mcq",prompt:"Why is \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064C impossible?",options:["\u0627\u0644 and tanw\u012Bn send opposite signals and never combine","\u0643\u062A\u0627\u0628 is feminine","tanw\u012Bn only goes on verbs","it needs a preposition"],answer:0,explanation:""},{type:"mcq",prompt:"Egyptian: \u0641\u064A \u0631\u0627\u062C\u0644 \u0641\u064A \u0627\u0644\u0628\u064A\u062A. Best Fu\u1E63\u1E25\u0101:",options:["\u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 \u0631\u064E\u062C\u064F\u0644\u064C","\u0627\u0644\u0631\u064E\u0651\u062C\u064F\u0644\u064F \u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650","\u0631\u064E\u062C\u064F\u0644\u064C \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u064F","\u0641\u0650\u064A \u0631\u064E\u062C\u064F\u0644\u064D \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650"],answer:0,explanation:"A nakirah subject is normally delayed after a fronted prepositional phrase."},{type:"open",prompt:"Explain the switch from \u0631\u064E\u0633\u064F\u0648\u0644\u064B\u0627 to \u0627\u0644\u0631\u064E\u0651\u0633\u064F\u0648\u0644\u064E in Qur\u2019an 73:15\u201316.",model:"The first mention introduces an unspecified messenger, so it is nakirah with tanw\u012Bn. The second refers back to that same, now-known messenger, so it takes \u0627\u0644 and is ma\u02BFrifah."}],review:[{type:"type",prompt:"Indefinite noun. What is the Arabic term?",answers:["\u0646\u0643\u0631\u0629","\u0627\u0644\u0646\u0643\u0631\u0629"],explanation:"\u0646\u064E\u0643\u0650\u0631\u064E\u0629."},{type:"mcq",prompt:"Which is NOT one of the \u0627\u0644\u0645\u0639\u0627\u0631\u0641?",options:["a noun with tanw\u012Bn and no other marker","a pronoun","a demonstrative","a proper name"],answer:0,explanation:""}]},"1.7":{sections:[{kind:"text",heading:"The idea",body:"Arabic grammar names a sentence by **its first word**. Start with a noun and it is a **\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0633\u0652\u0645\u0650\u064A\u064E\u0651\u0629**; start with a verb and it is a **\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0641\u0650\u0639\u0652\u0644\u0650\u064A\u064E\u0651\u0629**. Each has its own two pillars (\u0627\u0644\u0631\u064F\u0651\u0643\u0652\u0646\u0627\u0646\u0650)."},{kind:"table",heading:"The two sentence types",head:["Type","Pillars","Example"],rows:[["\u0627\u0644\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0644\u0627\u0633\u0652\u0645\u0650\u064A\u064E\u0651\u0629","\u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623 + \u062E\u064E\u0628\u064E\u0631","\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F \u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u064C"],["\u0627\u0644\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0644\u0641\u0650\u0639\u0652\u0644\u0650\u064A\u064E\u0651\u0629","\u0641\u0650\u0639\u0652\u0644 + \u0641\u0627\u0639\u0650\u0644","\u0646\u064E\u062C\u064E\u062D\u064E \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0627\u0644\u062C\u064F\u0645\u0652\u0644\u064E\u0629",tr:"al-jumlah",en:"sentence"},{ar:"\u0627\u0644\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0644\u0627\u0633\u0652\u0645\u0650\u064A\u064E\u0651\u0629",tr:"al-jumlah al-ismiyyah",en:"nominal sentence (starts with a noun)"},{ar:"\u0627\u0644\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0644\u0641\u0650\u0639\u0652\u0644\u0650\u064A\u064E\u0651\u0629",tr:"al-jumlah al-fi\u02BFliyyah",en:"verbal sentence (starts with a verb)"},{ar:"\u0627\u0644\u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623",tr:"al-mubtada\u02BE",en:"the topic the sentence begins with"},{ar:"\u0627\u0644\u062E\u064E\u0628\u064E\u0631",tr:"al-khabar",en:"the information given about it"},{ar:"\u0627\u0644\u0641\u0627\u0639\u0650\u0644",tr:"al-f\u0101\u02BFil",en:"the doer of the verb"}]},{kind:"examples",heading:"Examples",items:[{ar:"{r:\u0627\u0644\u0644\u0647\u064F} {r:\u063A\u064E\u0641\u064F\u0648\u0631\u064C}",eg:"\u0631\u0628\u0646\u0627 \u063A\u0641\u0648\u0631",en:"Allah is Forgiving.",note:"Nominal: mubtada\u02BE + khabar, both marf\u016B\u02BF. No \u2018is\u2019 word is needed."},{ar:"{r:\u0627\u0644\u0628\u064E\u064A\u0652\u062A\u064F} {r:\u0643\u064E\u0628\u0650\u064A\u0631\u064C}",eg:"\u0627\u0644\u0628\u064A\u062A \u0643\u0628\u064A\u0631",en:"The house is big.",note:"Mubtada\u02BE ma\u02BFrifah, khabar nakirah."},{ar:"{r:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064E\u0629\u064F} {r:\u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u064E\u0629\u064C}",eg:"\u0627\u0644\u0637\u0627\u0644\u0628\u0629 \u0634\u0627\u0637\u0631\u0629",en:"The student is hardworking.",note:"The khabar matches in gender."},{ar:"\u0630\u064E\u0647\u064E\u0628\u064E {r:\u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F}",eg:"\u0627\u0644\u0648\u0644\u062F \u0631\u0627\u062D",en:"The boy went.",note:"Verbal: \u0641\u0639\u0644 + \u0641\u0627\u0639\u0644 (marf\u016B\u02BF)."},{ar:"\u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0630\u064E\u0647\u064E\u0628\u064E",eg:"\u0627\u0644\u0648\u0644\u062F \u0631\u0627\u062D",en:"The boy went.",note:"Starts with a noun, so technically nominal: \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F is mubtada\u02BE and the verbal sentence \u0630\u064E\u0647\u064E\u0628\u064E is its khabar."}]},{kind:"text",heading:"Why it works this way",body:`**Why no word for \u2018is\u2019?** In a nominal sentence the link between mubtada\u02BE and khabar is the sentence structure itself (\u0627\u0644\u0625\u0650\u0633\u0652\u0646\u0627\u062F). Arabic only adds a verb like \u0643\u0627\u0646\u064E when it needs to set the time (Chapter 10).

**Why is the mubtada\u02BE usually ma\u02BFrifah?** You normally speak about something the listener can identify, then tell them something new about it. That\u2019s why \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F \u062C\u064E\u062F\u0650\u064A\u062F\u064C is natural and \u0643\u0650\u062A\u0627\u0628\u064C \u062C\u064E\u062F\u0650\u064A\u062F\u064C reads as a phrase (\u2018a new book\u2019), not a sentence.

**Both pillars are marf\u016B\u02BF.** The mubtada\u02BE is marf\u016B\u02BF because it is the starting point (the grammarians call its cause \u0627\u0644\u0627\u0628\u0652\u062A\u0650\u062F\u0627\u0621, an abstract operator), and the khabar is marf\u016B\u02BF as its partner. The f\u0101\u02BFil is marf\u016B\u02BF because the verb acts on it.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian strongly prefers noun-first: \u0627\u0644\u0648\u0644\u062F \u0631\u0627\u062D\u060C \u0645\u062D\u0645\u062F \u062C\u0647. So a sentence that is verbal in a Fu\u1E63\u1E25\u0101 story (\u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F) usually comes out nominal in Egyptian.

The nominal sentence without \u2018is\u2019 is identical in both: \u0627\u0644\u0628\u064A\u062A \u0643\u0628\u064A\u0631. Egyptian even keeps the \u2018fronted khabar\u2019 pattern: \u0639\u0646\u062F\u064A \u0633\u0624\u0627\u0644 = \u0639\u0650\u0646\u0652\u062F\u0650\u064A \u0633\u064F\u0624\u0627\u0644\u064C.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C \u0631\u064E\u0633\u064F\u0648\u0644\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650\uFD3E",ref:"S\u016Brat al-Fat\u1E25 48:29 (opening)",en:"Mu\u1E25ammad is the Messenger of Allah.",note:"Nominal: \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C mubtada\u02BE, \u0631\u064E\u0633\u064F\u0648\u0644\u064F khabar (and the \u0645\u0636\u0627\u0641 of \u0627\u0644\u0644\u064E\u0651\u0647\u0650)."},{ar:"\uFD3F\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0627\u0644\u0635\u064E\u0651\u0645\u064E\u062F\u064F\uFD3E",ref:"S\u016Brat al-Ikhl\u0101\u1E63 112:2",en:"Allah, the Eternal Refuge.",note:"Nominal, both parts marf\u016B\u02BF."},{ar:"\uFD3F\u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E\uFD3E",ref:"S\u016Brat al-Mu\u02BEmin\u016Bn 23:1",en:"The believers have succeeded.",note:"Verbal: \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0641\u0639\u0644, \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E \u0641\u0627\u0639\u0644."}]}],exercises:[{type:"mcq",prompt:"\u0627\u0644\u0633\u064E\u0651\u0645\u0627\u0621\u064F \u0635\u0627\u0641\u0650\u064A\u064E\u0629\u064C is:",options:["\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0627\u0633\u0652\u0645\u0650\u064A\u064E\u0651\u0629","\u062C\u064F\u0645\u0652\u0644\u064E\u0629 \u0641\u0650\u0639\u0652\u0644\u0650\u064A\u064E\u0651\u0629"],answer:0,explanation:"It starts with a noun."},{type:"mcq",prompt:"In \u0643\u064E\u062A\u064E\u0628\u064E \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F, \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F is:",options:["\u0627\u0644\u0641\u0627\u0639\u0650\u0644","\u0627\u0644\u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623","\u0627\u0644\u062E\u064E\u0628\u064E\u0631","\u0627\u0644\u0645\u064E\u0641\u0652\u0639\u064F\u0648\u0644 \u0628\u0650\u0647\u0650"],answer:0,explanation:"The doer after a verb."},{type:"type",prompt:"The part that gives information about the mubtada\u02BE. What is the Arabic term?",answers:["\u0627\u0644\u062E\u0628\u0631","\u062E\u0628\u0631"],explanation:"\u0627\u0644\u062E\u064E\u0628\u064E\u0631."},{type:"mcq",prompt:"Choose the correct khabar: \u0627\u0644\u0628\u0650\u0646\u0652\u062A\u064F \u2026",options:["\u062C\u064E\u0645\u0650\u064A\u0644\u064E\u0629\u064C","\u062C\u064E\u0645\u0650\u064A\u0644\u064C","\u0627\u0644\u062C\u064E\u0645\u0650\u064A\u0644\u064E\u0629\u064F","\u062C\u064E\u0645\u0650\u064A\u0644\u064E\u0629\u064B"],answer:0,explanation:"Feminine, nakirah, marf\u016B\u02BF."},{type:"mcq",prompt:"Egyptian \u0645\u062D\u0645\u062F \u062C\u0647. The Fu\u1E63\u1E25\u0101 verbal sentence is:",options:["\u062C\u0627\u0621\u064E \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C","\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C \u062C\u0627\u0621\u064E","\u062C\u0627\u0621\u064E \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627","\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u062C\u0627\u0621\u064E"],answer:0,explanation:"Verb first, f\u0101\u02BFil marf\u016B\u02BF."},{type:"open",prompt:"Is \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0630\u064E\u0647\u064E\u0628\u064E a nominal or verbal sentence, and why?",model:"Nominal: it begins with a noun. \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F is the mubtada\u02BE, and the verbal sentence \u0630\u064E\u0647\u064E\u0628\u064E (with a hidden pronoun as its f\u0101\u02BFil) is the khabar."}],review:[{type:"type",prompt:"The doer of the verb. What is the Arabic term?",answers:["\u0627\u0644\u0641\u0627\u0639\u0644","\u0641\u0627\u0639\u0644"],explanation:"\u0627\u0644\u0641\u0627\u0639\u0650\u0644."},{type:"mcq",prompt:"The case of both mubtada\u02BE and khabar:",options:["\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639","\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628","\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631","\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645"],answer:0,explanation:""}]},"1.8":{sections:[{kind:"text",heading:"The idea",body:"Before the full system in Chapter 2, you need four labels. When a grammarian describes a word\u2019s ending, they say it is **\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639**, **\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628**, **\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631** or **\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645**. These name the grammatical state the word is in, each with a default vowel."},{kind:"table",heading:"The four labels",head:["Label","Default sign","Applies to","Example"],rows:[["\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639","\u0636\u064E\u0645\u064E\u0651\u0629 \u0640\u064F","nouns and present verbs","{r:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F} / {r:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F}"],["\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628","\u0641\u064E\u062A\u0652\u062D\u064E\u0629 \u0640\u064E","nouns and present verbs","{n:\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064E} / \u0644\u064E\u0646\u0652 {n:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064E}"],["\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631","\u0643\u064E\u0633\u0652\u0631\u064E\u0629 \u0640\u0650","nouns only","\u0641\u0650\u064A {j:\u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650}"],["\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645","\u0633\u064F\u0643\u064F\u0648\u0646 \u0640\u0652","present verbs only","\u0644\u064E\u0645\u0652 {z:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u0652}"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639",tr:"marf\u016B\u02BF",en:"in the raf\u02BF state (default sign: \u1E0Dammah)"},{ar:"\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628",tr:"man\u1E63\u016Bb",en:"in the na\u1E63b state (default sign: fat\u1E25ah)"},{ar:"\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631",tr:"majr\u016Br",en:"in the jarr state (default sign: kasrah)"},{ar:"\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645",tr:"majz\u016Bm",en:"in the jazm state (default sign: suk\u016Bn)"}]},{kind:"examples",heading:"One sentence, three labels",items:[{ar:"\u0643\u064E\u062A\u064E\u0628\u064E {r:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F} {n:\u0627\u0644\u062F\u064E\u0651\u0631\u0652\u0633\u064E} \u0641\u0650\u064A {j:\u0627\u0644\u062F\u064E\u0651\u0641\u0652\u062A\u064E\u0631\u0650}",eg:"\u0627\u0644\u0637\u0627\u0644\u0628 \u0643\u062A\u0628 \u0627\u0644\u062F\u0631\u0633 \u0641\u064A \u0627\u0644\u0643\u0634\u0643\u0648\u0644",en:"The student wrote the lesson in the notebook.",note:"\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F f\u0101\u02BFil \u2192 marf\u016B\u02BF; \u0627\u0644\u062F\u064E\u0651\u0631\u0652\u0633\u064E object \u2192 man\u1E63\u016Bb; \u0627\u0644\u062F\u064E\u0651\u0641\u0652\u062A\u064E\u0631\u0650 after \u0641\u064A \u2192 majr\u016Br."},{ar:"\u0644\u064E\u0645\u0652 {z:\u064A\u064E\u062D\u0652\u0636\u064F\u0631\u0652} {r:\u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F}",eg:"\u0627\u0644\u0645\u062F\u0631\u0633 \u0645\u0627\u062C\u0627\u0634",en:"The teacher didn\u2019t come.",note:"\u064A\u064E\u062D\u0652\u0636\u064F\u0631\u0652 after \u0644\u0645 \u2192 majz\u016Bm; \u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F f\u0101\u02BFil \u2192 marf\u016B\u02BF."}]},{kind:"text",heading:"Why it works this way",body:"The labels are passive participles (the \u0645\u064E\u0641\u0652\u0639\u064F\u0648\u0644 pattern): \u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639 \u2018raised\u2019, \u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628 \u2018set up\u2019, \u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631 \u2018pulled\u2019, \u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645 \u2018cut off\u2019. They describe what was done to the word by whatever acts on it. Chapter 2 names that actor (\u0627\u0644\u0639\u0627\u0645\u0650\u0644) and explains every case in depth."},{kind:"text",heading:"Egyptian bridge",body:"Egyptian has none of these endings in normal speech, so these labels describe something you\u2019ve never pronounced. The fastest way in: read Qur\u2019an you already know by heart and notice the vowel on the last letter of each word. You\u2019ve been saying marf\u016B\u02BF, man\u1E63\u016Bb and majr\u016Br words for years; now you\u2019re learning their names."},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F{r:\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F} {j:\u0644\u0650\u0644\u064E\u0651\u0647\u0650} {j:\u0631\u064E\u0628\u0650\u0651} {j:\u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E}\uFD3E",ref:"S\u016Brat al-F\u0101ti\u1E25ah 1:2",en:"All praise is for Allah, Lord of the worlds.",note:"\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F marf\u016B\u02BF; the rest majr\u016Br."}]}],exercises:[{type:"mcq",prompt:"A word ending in kasrah because of \u0641\u064A is:",options:["\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631","\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639","\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628","\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645"],answer:0,explanation:""},{type:"mcq",prompt:"Which label can never apply to a noun?",options:["\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645","\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631","\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628","\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639"],answer:0,explanation:"Jazm is for present verbs only."},{type:"type",prompt:"The lab That single observation is this whole subject. Some words carry an ending that responds to their position in the sentence. Others have an ending that is frozen. The first kind is \u0645\u064F\u0639\u0652\u0631\u064E\u0628; the second is \u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651.`},{kind:"examples",heading:"Examples",items:[{ar:"\u062C\u0627\u0621\u064E {r:\u0632\u064E\u064A\u0652\u062F\u064C}",eg:"\u0632\u064A\u062F \u062C\u0647",en:"Zayd came.",note:"Zayd is the one doing the coming (\u0641\u0627\u0639\u0644) \u2192 \u0645\u0631\u0641\u0648\u0639 \u2192 \u1E0Dammah, heard as -un with tanw\u012Bn."},{ar:"\u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F {n:\u0632\u064E\u064A\u0652\u062F\u064B\u0627}",eg:"\u0634\u064F\u0641\u062A \u0632\u064A\u062F",en:"I saw Zayd.",note:"Zayd receives the action (\u0645\u0641\u0639\u0648\u0644 \u0628\u0647) \u2192 \u0645\u0646\u0635\u0648\u0628 \u2192 fat\u1E25ah, heard as -an."},{ar:"\u0645\u064E\u0631\u064E\u0631\u0652\u062A\u064F {j:\u0628\u0650\u0632\u064E\u064A\u0652\u062F\u064D}",eg:"\u0639\u062F\u0651\u064A\u062A \u0639\u0644\u0649 \u0632\u064A\u062F",en:"I passed by Zayd.",note:"Zayd comes after the preposition \u0628\u0650\u0640 \u2192 \u0645\u062C\u0631\u0648\u0631 \u2192 kasrah, heard as -in."},{ar:"\u062C\u0627\u0621\u064E \u0647\u0670\u0630\u0627",eg:"\u062F\u0647 \u062C\u0647",en:"This one came.",note:"Same role as Zayd in line one, but no \u1E0Dammah appears."},{ar:"\u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F \u0647\u0670\u0630\u0627",eg:"\u0634\u064F\u0641\u062A \u062F\u0647",en:"I saw this one.",note:"Object position, still ends in the same long \u0101."},{ar:"\u0645\u064E\u0631\u064E\u0631\u0652\u062A\u064F \u0628\u0650\u0647\u0670\u0630\u0627",eg:"\u0639\u062F\u0651\u064A\u062A \u0639\u0644\u0649 \u062F\u0647",en:"I passed by this one.",note:"After a preposition, still unchanged. \u0647\u0630\u0627 is \u0645\u0628\u0646\u064A."}]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0627\u0644\u0625\u0650 \u0627\u0644\u0625\u0650\u0639\u0652\u0631\u0627\u0628\u064F \u0647\u064F\u0648\u064E \u062A\u064E\u063A\u0652\u064A\u0650\u064A\u0631\u064F \u0623\u064E\u0648\u0627\u062E\u0650\u0631\u0650 \u0627\u0644\u0643\u064E\u0644\u0650\u0645\u0650 \u0644\u0627\u062E\u0652\u062A\u0650\u0644\u0627\u0641\u0650 \u0627\u0644\u0639\u064E\u0648\u0627\u0645\u0650\u0644\u0650 \u0627\u0644\u062F\u0651\u0627\u062E\u0650\u0644\u064E\u0629\u0650 \u0639\u064E\u0644\u064E\u064A\u0652\u0647\u0627 \u0644\u064E\u0641\u0652\u0638\u064B\u0627 \u0623\u064E\u0648\u0652 \u062A\u064E\u0642\u0652\u062F\u0650\u064A\u0631\u064B\u0627

Take it apart:
- \u062A\u064E\u063A\u0652\u064A\u0650\u064A\u0631\u064F: a change
- \u0623\u064E\u0648\u0627\u062E\u0650\u0631\u0650 \u0627\u0644\u0643\u064E\u0644\u0650\u0645\u0650: of the endings of words. Not beginnings or middles; internal changes belong to \u1E63arf, not na\u1E25w.
- \u0644\u0627\u062E\u0652\u062A\u0650\u0644\u0627\u0641\u0650 \u0627\u0644\u0639\u064E\u0648\u0627\u0645\u0650\u0644\u0650: because the operators differ
- \u0627\u0644\u062F\u0651\u0627\u062E\u0650\u0644\u064E\u0629\u0650 \u0639\u064E\u0644\u064E\u064A\u0652\u0647\u0627: that come onto those words
- \u0644\u064E\u0641\u0652\u0638\u064B\u0627 \u0623\u064E\u0648\u0652 \u062A\u064E\u0642\u0652\u062F\u0650\u064A\u0631\u064B\u0627: either audibly, or by implication

The last phrase matters. Some words can\u2019t pronounce their ending (\u0627\u0644\u0641\u064E\u062A\u064E\u0649\u060C \u0627\u0644\u0642\u0627\u0636\u0650\u064A), so the sign is only assumed. That is \u0627\u0644\u0625\u0639\u0631\u0627\u0628 \u0627\u0644\u0645\u064F\u0642\u064E\u062F\u064E\u0651\u0631, Subject 2.6.`},{kind:"table",heading:"Who is mabn\u012B?",head:["Word type","Status","Examples"],rows:[["Every \u062D\u064E\u0631\u0652\u0641","Always mabn\u012B","\u0641\u0650\u064A\u060C \u0644\u064E\u0645\u0652\u060C \u062B\u064F\u0645\u064E\u0651\u060C \u0625\u0650\u0646\u064E\u0651"],["\u0627\u0644\u0641\u0650\u0639\u0652\u0644 \u0627\u0644\u0645\u0627\u0636\u0650\u064A","Always mabn\u012B","\u0643\u064E\u062A\u064E\u0628\u064E\u060C \u0643\u064E\u062A\u064E\u0628\u064F\u0648\u0627\u060C \u0643\u064E\u062A\u064E\u0628\u0652\u062A\u064F"],["\u0641\u0650\u0639\u0652\u0644 \u0627\u0644\u0623\u064E\u0645\u0652\u0631","Always mabn\u012B","\u0627\u064F\u0643\u0652\u062A\u064F\u0628\u0652"],["\u0627\u0644\u0641\u0650\u0639\u0652\u0644 \u0627\u0644\u0645\u064F\u0636\u0627\u0631\u0650\u0639","Mu\u02BFrab, unless \u0646\u0648\u0646 \u0627\u0644\u0646\u0633\u0648\u0629 or \u0646\u0648\u0646 \u0627\u0644\u062A\u0648\u0643\u064A\u062F attaches","\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F / \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u0652\u0646\u064E"],["Most nouns","Mu\u02BFrab","\u0643\u0650\u062A\u0627\u0628\u064C\u060C \u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F\u060C \u0632\u064E\u064A\u0652\u062F\u064C"],["Pronouns","Mabn\u012B","\u0647\u064F\u0648\u064E\u060C \u0623\u064E\u0646\u0627\u060C \u0646\u064E\u062D\u0652\u0646\u064F"],["Demonstratives","Mabn\u012B, except the dual \u0647\u0670\u0630\u0627\u0646\u0650 / \u0647\u0670\u0630\u064E\u064A\u0652\u0646\u0650","\u0647\u0670\u0630\u0627\u060C \u0647\u0670\u0624\u064F\u0644\u0627\u0621\u0650"],["Relative nouns","Mabn\u012B, except the dual \u0627\u0644\u0644\u064E\u0651\u0630\u0627\u0646\u0650 / \u0627\u0644\u0644\u064E\u0651\u0630\u064E\u064A\u0652\u0646\u0650","\u0627\u0644\u064E\u0651\u0630\u0650\u064A\u060C \u0627\u0644\u064E\u0651\u062A\u0650\u064A"],["Question and condition words","Mabn\u012B","\u0645\u064E\u0646\u0652\u060C \u0645\u0627\u060C \u0643\u064E\u064A\u0652\u0641\u064E"],["Some adverbs","Mabn\u012B","\u0627\u0644\u0622\u0646\u064E\u060C \u062D\u064E\u064A\u0652\u062B\u064F\u060C \u0623\u064E\u0645\u0652\u0633\u0650"]]},{kind:"table",heading:"The four ways to be built",head:["Built on","Examples"],rows:[["\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0636\u064E\u0651\u0645\u0651","\u0646\u064E\u062D\u0652\u0646\u064F\u060C \u062D\u064E\u064A\u0652\u062B\u064F\u060C \u0645\u064F\u0646\u0652\u0630\u064F"],["\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0641\u064E\u062A\u0652\u062D","\u0643\u064E\u062A\u064E\u0628\u064E\u060C \u0623\u064E\u064A\u0652\u0646\u064E\u060C \u062B\u064F\u0645\u064E\u0651"],["\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0643\u064E\u0633\u0652\u0631","\u0647\u0670\u0624\u064F\u0644\u0627\u0621\u0650\u060C \u0623\u064E\u0645\u0652\u0633\u0650"],["\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646","\u0645\u064E\u0646\u0652\u060C \u0643\u064E\u0645\u0652\u060C \u0644\u064E\u0645\u0652\u060C \u0627\u064F\u0643\u0652\u062A\u064F\u0628\u0652"]]},{kind:"text",heading:"Why it works this way",body:`**Endings free up word order.** In \u0623\u064E\u0643\u0652\u0631\u064E\u0645\u064E {n:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064E} {r:\u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F} the object comes first, yet nobody is confused: the \u1E0Dammah marks the teacher as the doer and the fat\u1E25ah marks the student as the one honored. Swap the vowels and you swap who honored whom. The Qur\u2019an uses this freedom constantly for emphasis and rhythm.

**Why are some words mabn\u012B?** The grammarians\u2019 answer: the default for nouns is i\u02BFr\u0101b, and the default for verbs and particles is bin\u0101\u02BE. Nouns that resemble particles (pronouns, demonstratives, relatives and question words all need other words to complete their meaning) inherit bin\u0101\u02BE. This is called \u0634\u064E\u0628\u064E\u0647 \u0627\u0644\u062D\u064E\u0631\u0652\u0641. The present verb, in turn, resembles the noun (\u064A\u064E\u0636\u0652\u0631\u0650\u0628\u064F parallels \u0636\u0627\u0631\u0650\u0628), so it inherits i\u02BFr\u0101b. That resemblance is literally where its name \u0627\u0644\u0645\u064F\u0636\u0627\u0631\u0650\u0639 (\u2018the resembling one\u2019) comes from.

**A mabn\u012B word still has a job.** In \u0647\u0670\u0630\u0627 \u0643\u0650\u062A\u0627\u0628\u064C, \u0647\u0630\u0627 is the mubtada\u02BE just as \u0627\u0644\u0643\u062A\u0627\u0628\u064F is in \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F \u062C\u064E\u062F\u0650\u064A\u062F\u064C. It simply can\u2019t show a \u1E0Dammah. So the parser writes:

\u0627\u0633\u0652\u0645\u064F \u0625\u0650\u0634\u0627\u0631\u064E\u0629\u064D \u0645\u064E\u0628\u0652\u0646\u0650\u064A\u064C\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646\u0650 \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0650\u0651 \u0631\u064E\u0641\u0652\u0639\u064D \u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623\u064C

A demonstrative, built on suk\u016Bn, in the position of raf\u02BF, as the mubtada\u02BE. You will write \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0650\u0651 for every mabn\u012B word you ever parse.`},{kind:"text",heading:"Egyptian bridge",body:`Fu\u1E63\u1E25\u0101 does i\u02BFr\u0101b; Egyptian commonly treats almost every word as if it were fixed. \u0634\u064F\u0641\u062A \u0645\u062D\u0645\u062F\u060C \u0645\u062D\u0645\u062F \u062C\u0647\u060C \u0633\u0644\u0651\u0645\u062A \u0639\u0644\u0649 \u0645\u062D\u0645\u062F: \u0645\u062D\u0645\u062F sounds identical in all three. Egyptian relies on fairly fixed word order and context instead, which is why \u0623\u0643\u0631\u0645\u064E \u0627\u0644\u0637\u0627\u0644\u0628\u064E \u0627\u0644\u0645\u0639\u0644\u0645\u064F sounds odd to an Egyptian ear. A useful way to think of it: everyday Egyptian speech uses something like the Fu\u1E63\u1E25\u0101 pause form almost everywhere. (Linguists still debate exactly how the dialects lost case; the practical effect is the same.)

Egyptian still carries fossils of i\u02BFr\u0101b you say every day: \u0634\u064F\u0643\u0652\u0631\u064B\u0627\u060C \u0623\u064E\u0628\u064E\u062F\u064B\u0627\u060C \u0637\u064E\u0628\u0652\u0639\u064B\u0627\u060C \u0623\u064E\u0647\u0652\u0644\u064B\u0627 \u0648\u064E\u0633\u064E\u0647\u0652\u0644\u064B\u0627\u060C \u062C\u0650\u062F\u064B\u0651\u0627. Each ends in -an, which is tanw\u012Bn with fat\u1E25ah, the sign of na\u1E63b. They survived because they are fixed expressions. You\u2019ll learn exactly why each one is man\u1E63\u016Bb in Chapter 12.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C\uFD3E",ref:"S\u016Brat al-Ikhl\u0101\u1E63 112:1",en:"Say: He is Allah, One.",note:"\u0642\u064F\u0644\u0652 is a command verb, mabn\u012B on suk\u016Bn. \u0647\u064F\u0648\u064E is a pronoun, mabn\u012B on fat\u1E25ah, in the position of raf\u02BF. \u0627\u0644\u0644\u064E\u0651\u0647\u064F and \u0623\u064E\u062D\u064E\u062F\u064C are mu\u02BFrab nouns, both showing \u1E0Dammah here."},{ar:"\uFD3F\u0630\u064E\u0670\u0644\u0650\u0643\u064E \u0627\u0644\u0652\u0643\u0650\u062A\u064E\u0627\u0628\u064F \u0644\u064E\u0627 \u0631\u064E\u064A\u0652\u0628\u064E \u0641\u0650\u064A\u0647\u0650\uFD3E",ref:"S\u016Brat al-Baqarah 2:2",en:"That is the Book; there is no doubt in it.",note:"\u0630\u064E\u0670\u0644\u0650\u0643\u064E is a demonstrative: mabn\u012B. \u0627\u0644\u0652\u0643\u0650\u062A\u064E\u0627\u0628\u064F is mu\u02BFrab with \u1E0Dammah. \u0641\u0650\u064A is a particle, mabn\u012B on suk\u016Bn; the \u0640\u0647\u0650 is a pronoun mabn\u012B on kasrah in the position of jarr. Preview: \u0631\u064E\u064A\u0652\u0628\u064E is normally a mu\u02BFrab noun, but after \u0644\u0627 \u0627\u0644\u0646\u0627\u0641\u064A\u0629 \u0644\u0644\u062C\u0646\u0633 it becomes mabn\u012B on fat\u1E25ah (Chapter 10)."}]}],exercises:[{type:"mcq",prompt:"Which of these words is \u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651?",options:["\u0643\u0650\u062A\u0627\u0628\u064C","\u0647\u0670\u0624\u064F\u0644\u0627\u0621\u0650","\u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F","\u0642\u064E\u0644\u064E\u0645\u064B\u0627"],answer:1,explanation:"\u0647\u0670\u0624\u064F\u0644\u0627\u0621\u0650 is a plural demonstrative. It ends in kasrah in every position. The others are ordinary nouns whose endings move."},{type:"type",prompt:"The element that comes onto a word and causes its ending to change. What is the Arabic term?",answers:["\u0627\u0644\u0639\u0627\u0645\u0644","\u0639\u0627\u0645\u0644"],explanation:"\u0627\u0644\u0639\u0627\u0645\u0650\u0644 (al-\u02BF\u0101mil), plural \u0627\u0644\u0639\u064E\u0648\u0627\u0645\u0650\u0644. Examples: a \u062D\u0631\u0641 \u062C\u0631, \u0644\u0645, or the verb acting on its doer."},{type:"mcq",prompt:"\u0643\u064E\u062A\u064E\u0628\u064E (he wrote) is:",options:["\u0645\u064F\u0639\u0652\u0631\u064E\u0628","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0641\u064E\u062A\u0652\u062D","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0636\u064E\u0651\u0645\u0651"],answer:1,explanation:"Every past verb is mabn\u012B. With nothing attached, it is built on fat\u1E25ah."},{type:"mcq",prompt:"In \u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064E, the word \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064E is:",options:["\u0645\u064F\u0639\u0652\u0631\u064E\u0628: its ending reflects its position","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651: it always ends in fat\u1E25ah","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0651 \u0646\u064E\u0635\u0652\u0628","\u062D\u064E\u0631\u0652\u0641"],answer:0,explanation:"Compare \u062C\u0627\u0621\u064E \u0627\u0644\u0637\u0627\u0644\u0628\u064F and \u0645\u0631\u0631\u062A\u064F \u0628\u0627\u0644\u0637\u0627\u0644\u0628\u0650. The ending moves, so it is mu\u02BFrab. Here it is the object \u2192 \u0645\u0646\u0635\u0648\u0628 \u2192 fat\u1E25ah."},{type:"mcq",prompt:"\u0647\u0670\u0630\u0627 in \u0647\u0670\u0630\u0627 \u0628\u064E\u064A\u0652\u062A\u064C is best described as:",options:["\u0645\u064F\u0639\u0652\u0631\u064E\u0628 \u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639 \u0628\u0627\u0644\u0636\u064E\u0651\u0645\u064E\u0651\u0629","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0651 \u0631\u064E\u0641\u0652\u0639","\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0651 \u062C\u064E\u0631\u0651","\u0641\u0650\u0639\u0652\u0644 \u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651"],answer:1,explanation:"\u0647\u0630\u0627 is the mubtada\u02BE, a raf\u02BF position, but it can\u2019t show a \u1E0Dammah: \u0645\u0628\u0646\u064A \u0639\u0644\u0649 \u0627\u0644\u0633\u0643\u0648\u0646 \u0641\u064A \u0645\u062D\u0644 \u0631\u0641\u0639 \u0645\u0628\u062A\u062F\u0623."},{type:"type",prompt:"A word whose ending never changes, whatever its position. What is the Arabic term?",answers:["\u0627\u0644\u0645\u0628\u0646\u064A","\u0645\u0628\u0646\u064A"],explanation:"\u0627\u0644\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651 (al-mabn\u012B)."},{type:"mcq",prompt:"Which statement is true?",options:["All present-tense verbs are mabn\u012B","All past-tense verbs are mabn\u012B","All nouns are mu\u02BFrab","All particles are mu\u02BFrab"],answer:1,explanation:"Past verbs, command verbs and all particles are mabn\u012B. The present verb is mu\u02BFrab (unless \u0646\u0648\u0646 \u0627\u0644\u0646\u0633\u0648\u0629 or \u0646\u0648\u0646 \u0627\u0644\u062A\u0648\u0643\u064A\u062F attaches), and a set of nouns is mabn\u012B."},{type:"mcq",prompt:"Why does an Egyptian still pronounce \u0634\u064F\u0643\u0652\u0631\u064B\u0627 with -an?",options:["It\u2019s a fixed expression preserving an old man\u1E63\u016Bb ending","Egyptian adds -an to every noun","It was borrowed from Turkish","The -an marks a plural"],answer:0,explanation:"It is a frozen Fu\u1E63\u1E25\u0101 form: tanw\u012Bn with fat\u1E25ah, the sign of na\u1E63b, preserved inside a set phrase."},{type:"mcq",prompt:"In \u0645\u064E\u0646\u0652 \u062C\u0627\u0621\u064E\u061F the word \u0645\u064E\u0646\u0652 is mabn\u012B on:",options:["\u0627\u0644\u0636\u064E\u0651\u0645\u0651","\u0627\u0644\u0641\u064E\u062A\u0652\u062D","\u0627\u0644\u0643\u064E\u0633\u0652\u0631","\u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646"],answer:3,explanation:"\u0645\u064E\u0646\u0652 ends in a suk\u016Bn: \u0645\u0628\u0646\u064A \u0639\u0644\u0649 \u0627\u0644\u0633\u0643\u0648\u0646. Here it is in the position of raf\u02BF as the mubtada\u02BE."},{type:"open",prompt:"In your own words: why do \u062C\u0627\u0621\u064E \u0632\u064E\u064A\u0652\u062F\u064C and \u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F \u0632\u064E\u064A\u0652\u062F\u064B\u0627 end differently, while \u062C\u0627\u0621\u064E \u0647\u0670\u0630\u0627 and \u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F \u0647\u0670\u0630\u0627 end the same?",model:"\u0632\u064A\u062F is mu\u02BFrab, so its ending shows its job: doer (raf\u02BF, -un) vs object (na\u1E63b, -an). \u0647\u0630\u0627 is mabn\u012B: its ending is fixed, so its job is recorded only as a position (\u0641\u064A \u0645\u062D\u0644 \u0631\u0641\u0639 / \u0641\u064A \u0645\u062D\u0644 \u0646\u0635\u0628), not heard."}],review:[{type:"mcq",prompt:"What does \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0650\u0651 \u0631\u064E\u0641\u0652\u0639\u064D tell you about a word?",options:["It is mabn\u012B but occupies a raf\u02BF position","It shows a \u1E0Dammah","It is a verb","It is majr\u016Br"],answer:0,explanation:"\u0645\u064E\u062D\u064E\u0644\u0651 = position. The word can\u2019t show the sign, but it holds the role."},{type:"mcq",prompt:"Which demonstratives are the exception and treated as mu\u02BFrab?",options:["\u0647\u0670\u0630\u0627\u0646\u0650 / \u0647\u0670\u0630\u064E\u064A\u0652\u0646\u0650","\u0647\u0670\u0630\u0627 / \u0647\u0670\u0630\u0650\u0647\u0650","\u0647\u0670\u0624\u064F\u0644\u0627\u0621\u0650 / \u0623\u064F\u0648\u0644\u0670\u0626\u0650\u0643\u064E","\u0630\u0670\u0644\u0650\u0643\u064E / \u062A\u0650\u0644\u0652\u0643\u064E"],answer:0,explanation:"The dual demonstrative shows \u0640\u0627\u0646\u0650 in raf\u02BF and \u0640\u064E\u064A\u0652\u0646\u0650 in na\u1E63b and jarr, like any dual."},{type:"open",prompt:"Parse \u0647\u064F\u0648\u064E in \uFD3F\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C\uFD3E using the words \u0645\u0628\u0646\u064A and \u0645\u062D\u0644 (Arabic or English).",model:"\u0636\u064E\u0645\u0650\u064A\u0631\u064C \u0645\u064F\u0646\u0652\u0641\u064E\u0635\u0650\u0644\u064C \u0645\u064E\u0628\u0652\u0646\u0650\u064A\u064C\u0651 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0641\u064E\u062A\u0652\u062D\u0650 \u0641\u0650\u064A \u0645\u064E\u062D\u064E\u0644\u0650\u0651 \u0631\u064E\u0641\u0652\u0639\u064D \u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623\u064C: a detached pronoun, built on fat\u1E25ah, in the position of raf\u02BF, as the mubtada\u02BE."}]},"2.2":{sections:[{kind:"text",heading:"The idea",body:"Every mu\u02BFrab word sits in one of four states. Arabic names each state with a verbal noun (the process), and the word in that state with a \u0645\u064E\u0641\u0652\u0639\u064F\u0648\u0644-pattern adjective (the thing the process was done to). You\u2019ll recognize that pattern properly in Chapter 8."},{kind:"table",heading:"The four states",head:["State","Word in that state","Original sign"],rows:[["\u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639","\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639","\u0627\u0644\u0636\u064E\u0651\u0645\u064E\u0651\u0629 \u0640\u064F"],["\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628","\u0627\u0644\u0641\u064E\u062A\u0652\u062D\u064E\u0629 \u0640\u064E"],["\u0627\u0644\u062C\u064E\u0631\u0651 (\u0627\u0644\u062E\u064E\u0641\u0652\u0636)","\u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631 (\u0645\u064E\u062E\u0652\u0641\u064F\u0648\u0636)","\u0627\u0644\u0643\u064E\u0633\u0652\u0631\u064E\u0629 \u0640\u0650"],["\u0627\u0644\u062C\u064E\u0632\u0652\u0645","\u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645","\u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646 \u0640\u0652"]]},{kind:"text",heading:"Who can take which",body:`Ibn \u0100jurr\u016Bm, right after listing the four:

\u0641\u064E\u0644\u0650\u0644\u0652\u0623\u064E\u0633\u0652\u0645\u0627\u0621\u0650 \u0645\u0650\u0646\u0652 \u0630\u0670\u0644\u0650\u0643\u064E \u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639\u064F \u0648\u064E\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628\u064F \u0648\u064E\u0627\u0644\u062E\u064E\u0641\u0652\u0636\u064F \u0648\u064E\u0644\u0627 \u062C\u064E\u0632\u0652\u0645\u064E \u0641\u0650\u064A\u0647\u0627\u060C \u0648\u064E\u0644\u0650\u0644\u0652\u0623\u064E\u0641\u0652\u0639\u0627\u0644\u0650 \u0645\u0650\u0646\u0652 \u0630\u0670\u0644\u0650\u0643\u064E \u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639\u064F \u0648\u064E\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628\u064F \u0648\u064E\u0627\u0644\u062C\u064E\u0632\u0652\u0645\u064F \u0648\u064E\u0644\u0627 \u062E\u064E\u0641\u0652\u0636\u064E \u0641\u0650\u064A\u0647\u0627

Nouns take raf\u02BF, na\u1E63b and khaf\u1E0D, with no jazm. Verbs take raf\u02BF, na\u1E63b and jazm, with no khaf\u1E0D. \u2018Verbs\u2019 here means the present verb, since past and command verbs are mabn\u012B (Subject 2.1).`},{kind:"table",heading:"The map in one table",head:["State","Noun","Present verb"],rows:[["\u0631\u0641\u0639","Yes","Yes"],["\u0646\u0635\u0628","Yes","Yes"],["\u062C\u0631","Yes","Never"],["\u062C\u0632\u0645","Never","Yes"]]},{kind:"examples",heading:"Examples",items:[{ar:"{r:\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F} {r:\u062C\u064E\u062F\u0650\u064A\u062F\u064C}",eg:"\u0627\u0644\u0643\u062A\u0627\u0628 \u062C\u062F\u064A\u062F",en:"The book is new.",note:"Mubtada\u02BE and khabar are both \u0645\u0631\u0641\u0648\u0639 \u2192 \u1E0Dammah."},{ar:"\u0642\u064E\u0631\u064E\u0623\u0652\u062A\u064F {n:\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064E}",eg:"\u0642\u0631\u064A\u062A \u0627\u0644\u0643\u062A\u0627\u0628",en:"I read the book.",note:"The book receives the reading (\u0645\u0641\u0639\u0648\u0644 \u0628\u0647) \u2192 \u0645\u0646\u0635\u0648\u0628 \u2192 fat\u1E25ah."},{ar:"\u0646\u064E\u0638\u064E\u0631\u0652\u062A\u064F \u0641\u0650\u064A {j:\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u0650}",eg:"\u0628\u0635\u0651\u064A\u062A \u0641\u064A \u0627\u0644\u0643\u062A\u0627\u0628",en:"I looked in the book.",note:"\u0641\u064A is its \u02BF\u0101mil \u2192 \u0645\u062C\u0631\u0648\u0631 \u2192 kasrah."},{ar:"{r:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F} \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F",eg:"\u0627\u0644\u0637\u0627\u0644\u0628 \u0628\u064A\u0643\u062A\u0628",en:"The student writes.",note:"Nothing acts on the present verb \u2192 \u0645\u0631\u0641\u0648\u0639 by default \u2192 \u1E0Dammah."},{ar:"\u0644\u064E\u0646\u0652 {n:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064E}",eg:"\u0645\u0634 \u0647\u064A\u0643\u062A\u0628",en:"He will not write.",note:"\u0644\u0646 is a \u062D\u0631\u0641 \u0646\u0635\u0628 \u2192 \u0645\u0646\u0635\u0648\u0628 \u2192 fat\u1E25ah."},{ar:"\u0644\u064E\u0645\u0652 {z:\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u0652}",eg:"\u0645\u0643\u062A\u0628\u0634",en:"He did not write.",note:"\u0644\u0645 is a \u062D\u0631\u0641 \u062C\u0632\u0645 \u2192 \u0645\u062C\u0632\u0648\u0645 \u2192 suk\u016Bn. \u0644\u0645 + present form gives a past meaning."}]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639 / \u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639",tr:"ar-raf\u02BF / marf\u016B\u02BF",en:"raising: the \u1E0Dammah state"},{ar:"\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628 / \u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628",tr:"an-na\u1E63b / man\u1E63\u016Bb",en:"setting up: the fat\u1E25ah state"},{ar:"\u0627\u0644\u062C\u064E\u0631\u0651 / \u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631",tr:"al-jarr / majr\u016Br",en:"pulling: the kasrah state (nouns only)"},{ar:"\u0627\u0644\u062E\u064E\u0641\u0652\u0636 / \u0645\u064E\u062E\u0652\u0641\u064F\u0648\u0636",tr:"al-khaf\u1E0D / makhf\u016B\u1E0D",en:"lowering: the \u0100jurr\u016Bmiyyah\u2019s name for jarr"},{ar:"\u0627\u0644\u062C\u064E\u0632\u0652\u0645 / \u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645",tr:"al-jazm / majz\u016Bm",en:"cutting off: the suk\u016Bn state (verbs only)"},{ar:"\u0627\u0644\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0623\u064E\u0635\u0652\u0644\u0650\u064A\u064E\u0651\u0629",tr:"al-\u02BFal\u0101m\u0101t al-a\u1E63liyyah",en:"original signs: \u1E0Dammah, fat\u1E25ah, kasrah, suk\u016Bn"},{ar:"\u0627\u0644\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0641\u064E\u0631\u0652\u0639\u0650\u064A\u064E\u0651\u0629",tr:"al-\u02BFal\u0101m\u0101t al-far\u02BFiyyah",en:"substitute signs: letters or deletion"}]},{kind:"text",heading:"Why it works this way",body:`Every case answers one question: what is acting on this word? A first, rough map (each gets its own subject later):

- **\u0645\u0631\u0641\u0648\u0639**: \u0627\u0644\u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623, \u0627\u0644\u062E\u064E\u0628\u064E\u0631, \u0627\u0644\u0641\u0627\u0639\u0650\u0644, and the present verb when nothing acts on it
- **\u0645\u0646\u0635\u0648\u0628**: \u0627\u0644\u0645\u064E\u0641\u0652\u0639\u064F\u0648\u0644 \u0628\u0650\u0647\u0650, the noun after \u0625\u0650\u0646\u064E\u0651, the present verb after \u0623\u064E\u0646\u0652\u060C \u0644\u064E\u0646\u0652\u060C \u0643\u064E\u064A\u0652
- **\u0645\u062C\u0631\u0648\u0631**: the noun after a \u062D\u0631\u0641 \u062C\u0631, and \u0627\u0644\u0645\u064F\u0636\u0627\u0641 \u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650
- **\u0645\u062C\u0632\u0648\u0645**: the present verb after \u0644\u064E\u0645\u0652, \u0644\u0627 \u0627\u0644\u0646\u0627\u0647\u064A\u0629, and in conditional sentences

Now read your first real grammar-book sentence without translating the terms:

\u0627\u0644\u0641\u0627\u0639\u0650\u0644\u064F \u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639\u064C \u0648\u064E\u0627\u0644\u0645\u064E\u0641\u0652\u0639\u064F\u0648\u0644\u064F \u0628\u0650\u0647\u0650 \u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628\u064C

\u2018The doer is marf\u016B\u02BF and the object is man\u1E63\u016Bb.\u2019 The sentence obeys its own rule: \u0627\u0644\u0641\u0627\u0639\u0644\u064F is a mubtada\u02BE with \u1E0Dammah, and \u0645\u0631\u0641\u0648\u0639\u064C is its khabar with \u1E0Dammah.

**Why no jazm for nouns and no jarr for verbs?** Jarr only comes from things that attach to nouns (prepositions and i\u1E0D\u0101fah), and a verb can never be a \u0645\u0636\u0627\u0641 \u0625\u0644\u064A\u0647. Jazm was assigned to the verb as its own counterpart. A classic further explanation is that the verb is \u2018heavier\u2019 in meaning, so it receives the lightest sign: no vowel at all. Treat that as the tradition\u2019s reasoning (\u062A\u064E\u0639\u0652\u0644\u0650\u064A\u0644), not a law of physics.

**\u0627\u0644\u062C\u0631 or \u0627\u0644\u062E\u0641\u0636?** Same thing. Ibn \u0100jurr\u016Bm uses \u0627\u0644\u062E\u064E\u0641\u0652\u0636, the term associated with the K\u016Bfan grammarians; most modern textbooks, including \u0627\u0644\u0646\u062D\u0648 \u0627\u0644\u0648\u0627\u0636\u062D and the Madinah books, use the Ba\u1E63ran term \u0627\u0644\u062C\u064E\u0631\u0651. Expect both in classical texts.

**A preview of substitute signs.** You have already met some: \u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F\u0648\u0646\u064E (raf\u02BF with \u0648), \u0627\u0644\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0650\u064A\u0646\u064E (na\u1E63b and jarr with \u064A), \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u0627\u0646\u0650 (raf\u02BF with \u0627). The full system is Subject 2.5.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian dropped case endings on nouns, but look at what it did with verbs. Fu\u1E63\u1E25\u0101 uses a particle plus a change in the verb\u2019s last vowel; Egyptian uses separate markers:

- \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F \u2192 \u0628\u064A\u0643\u062A\u0628
- \u0644\u064E\u0646\u0652 \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064E \u2192 \u0645\u0634 \u0647\u064A\u0643\u062A\u0628
- \u0644\u064E\u0645\u0652 \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u0652 \u2192 \u0645\u0643\u062A\u0628\u0634 (a past form wrapped in \u0645\u0627\u2026\u0634)

The meaning survives, carried by \u0628\u0640, \u0647\u0640 and \u0645\u0627\u2026\u0634. When you read Fu\u1E63\u1E25\u0101, the particle together with the verb\u2019s ending does the work those Egyptian markers do.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F{r:\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F} {j:\u0644\u0650\u0644\u064E\u0651\u0647\u0650} {j:\u0631\u064E\u0628\u0650\u0651} {j:\u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E}\uFD3E",ref:"S\u016Brat al-F\u0101ti\u1E25ah 1:2",en:"All praise is for Allah, Lord of the worlds.",note:"\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F: mubtada\u02BE, marf\u016B\u02BF, \u1E0Dammah. \u0644\u0650\u0644\u064E\u0651\u0647\u0650: Allah after the preposition \u0644\u0650\u0640, majr\u016Br, kasrah. \u0631\u064E\u0628\u0650\u0651: follows Allah in jarr, kasrah. \u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E: majr\u016Br too, but with \u064A instead of kasrah. That\u2019s a substitute sign; it is treated like a sound masculine plural."},{ar:"\uFD3F\u0644\u064E\u0645\u0652 {z:\u064A\u064E\u0644\u0650\u062F\u0652} \u0648\u064E\u0644\u064E\u0645\u0652 {z:\u064A\u064F\u0648\u0644\u064E\u062F\u0652}\uFD3E",ref:"S\u016Brat al-Ikhl\u0101\u1E63 112:3",en:"He neither begets nor is born.",note:"Both verbs follow \u0644\u064E\u0645\u0652 \u2192 majz\u016Bm \u2192 suk\u016Bn. Without \u0644\u0645 they would be \u064A\u064E\u0644\u0650\u062F\u064F and \u064A\u064F\u0648\u0644\u064E\u062F\u064F."},{ar:"\uFD3F\u0625\u0650\u0646\u064E\u0651 {n:\u0627\u0644\u0644\u064E\u0651\u0647\u064E} {r:\u063A\u064E\u0641\u064F\u0648\u0631\u064C} {r:\u0631\u064E\u062D\u0650\u064A\u0645\u064C}\uFD3E",ref:"S\u016Brat al-Baqarah 2:173 (end of the \u0101yah)",en:"Indeed, Allah is Forgiving, Merciful.",note:"On its own you\u2019d say \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u063A\u064E\u0641\u064F\u0648\u0631\u064C with \u1E0Dammah on the mubtada\u02BE. \u0625\u0650\u0646\u064E\u0651 enters and makes its noun man\u1E63\u016Bb: \u0627\u0644\u0644\u064E\u0651\u0647\u064E. The khabar stays marf\u016B\u02BF. Preview of \u0625\u0646\u0651 \u0648\u0623\u062E\u0648\u0627\u062A\u0647\u0627."}]}],exercises:[{type:"mcq",prompt:"Which case state can never enter a noun?",options:["\u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639","\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","\u0627\u0644\u062C\u064E\u0631\u0651","\u0627\u0644\u062C\u064E\u0632\u0652\u0645"],answer:3,explanation:"\u0648\u064E\u0644\u0627 \u062C\u064E\u0632\u0652\u0645\u064E \u0641\u0650\u064A\u0647\u0627: nouns take raf\u02BF, na\u1E63b and jarr only."},{type:"mcq",prompt:"Which case state can never enter a verb?",options:["\u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639","\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","\u0627\u0644\u062C\u064E\u0631\u0651","\u0627\u0644\u062C\u064E\u0632\u0652\u0645"],answer:2,explanation:"\u0648\u064E\u0644\u0627 \u062E\u064E\u0641\u0652\u0636\u064E \u0641\u0650\u064A\u0647\u0627: verbs take raf\u02BF, na\u1E63b and jazm only."},{type:"type",prompt:"The original sign of na\u1E63b. What is the Arabic term?",answers:["\u0627\u0644\u0641\u062A\u062D\u0629","\u0641\u062A\u062D\u0629"],explanation:"\u0627\u0644\u0641\u064E\u062A\u0652\u062D\u064E\u0629 (al-fat\u1E25ah)."},{type:"type",prompt:"The original sign of jazm. What is the Arabic term?",answers:["\u0627\u0644\u0633\u0643\u0648\u0646","\u0633\u0643\u0648\u0646"],explanation:"\u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646 (as-suk\u016Bn)."},{type:"mcq",prompt:"In \u062C\u064E\u0644\u064E\u0633\u0652\u062A\u064F \u0641\u0650\u064A \u0627\u0644\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650, the word \u0627\u0644\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650 is:",options:["\u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639 \u0628\u0627\u0644\u0636\u064E\u0651\u0645\u064E\u0651\u0629","\u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628 \u0628\u0627\u0644\u06
