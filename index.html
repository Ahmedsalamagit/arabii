plied.","2.1"),z("bina","\u0627\u0644\u0628\u0650\u0646\u0627\u0621","al-bin\u0101\u02BE","A word\u2019s ending staying fixed whatever its position in the sentence.","2.1"),z("murab","\u0627\u0644\u0645\u064F\u0639\u0652\u0631\u064E\u0628","al-mu\u02BFrab","A word whose ending changes according to its grammatical position.","2.1"),z("mabni","\u0627\u0644\u0645\u064E\u0628\u0652\u0646\u0650\u064A\u0651","al-mabn\u012B","A word whose ending never changes, whatever its position.","2.1"),z("amil","\u0627\u0644\u0639\u0627\u0645\u0650\u0644","al-\u02BF\u0101mil","The element that acts on a word and causes its case, such as a preposition, a verb, or \u0644\u0645.","2.1",["\u0627\u0644\u0639\u0648\u0627\u0645\u0644"]),z("mahall","\u0627\u0644\u0645\u064E\u062D\u064E\u0644\u0651","al-ma\u1E25all","The grammatical position a mabn\u012B word occupies even though its ending can\u2019t show it, as in \u0641\u064A \u0645\u062D\u0644 \u0631\u0641\u0639.","2.1",["\u0641\u064A \u0645\u062D\u0644","\u0645\u062D\u0644"]),z("haraka","\u0627\u0644\u062D\u064E\u0631\u064E\u0643\u064E\u0629","al-\u1E25arakah","A short vowel mark on a letter: \u1E0Dammah, fat\u1E25ah or kasrah.","2.1",["\u0627\u0644\u062D\u0631\u0643\u0627\u062A"]),z("shabah","\u0634\u064E\u0628\u064E\u0647 \u0627\u0644\u062D\u064E\u0631\u0652\u0641","shabah al-\u1E25arf","The traditional reason some nouns are mabn\u012B: they resemble particles.","2.1",["\u0627\u0644\u0634\u0628\u0647 \u0628\u0627\u0644\u062D\u0631\u0641"]),z("raf","\u0627\u0644\u0631\u064E\u0651\u0641\u0652\u0639","ar-raf\u02BF","The case state shared by nouns and present verbs whose original sign is the \u1E0Dammah.","2.2"),z("nasb","\u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","an-na\u1E63b","The case state shared by nouns and present verbs whose original sign is the fat\u1E25ah.","2.2"),z("jarr","\u0627\u0644\u062C\u064E\u0631\u0651","al-jarr","The case state only nouns can take; its original sign is the kasrah.","2.2",["\u0627\u0644\u062E\u0641\u0636"]),z("khafd","\u0627\u0644\u062E\u064E\u0641\u0652\u0636","al-khaf\u1E0D","The name Ibn \u0100jurr\u016Bm (following the K\u016Bfan school) uses for jarr.","2.2",["\u0627\u0644\u062C\u0631"]),z("jazm","\u0627\u0644\u062C\u064E\u0632\u0652\u0645","al-jazm","The case state only present verbs can take; its original sign is the suk\u016Bn.","2.2"),z("damma","\u0627\u0644\u0636\u064E\u0651\u0645\u064E\u0651\u0629","a\u1E0D-\u1E0Dammah","The short u vowel mark; the original sign of raf\u02BF.","2.2"),z("fatha","\u0627\u0644\u0641\u064E\u062A\u0652\u062D\u064E\u0629","al-fat\u1E25ah","The short a vowel mark; the original sign of na\u1E63b.","2.2"),z("kasra","\u0627\u0644\u0643\u064E\u0633\u0652\u0631\u064E\u0629","al-kasrah","The short i vowel mark; the original sign of jarr.","2.2"),z("sukun","\u0627\u0644\u0633\u064F\u0651\u0643\u064F\u0648\u0646","as-suk\u016Bn","The mark showing no vowel; the original sign of jazm.","2.2"),z("asliyya","\u0627\u0644\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0623\u064E\u0635\u0652\u0644\u0650\u064A\u064E\u0651\u0629","al-\u02BFal\u0101m\u0101t al-a\u1E63liyyah","The four basic signs of i\u02BFr\u0101b: \u1E0Dammah, fat\u1E25ah, kasrah and suk\u016Bn.","2.2",["\u0639\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0625\u0639\u0631\u0627\u0628 \u0627\u0644\u0623\u0635\u0644\u064A\u0629"]),z("fariyya","\u0627\u0644\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0641\u064E\u0631\u0652\u0639\u0650\u064A\u064E\u0651\u0629","al-\u02BFal\u0101m\u0101t al-far\u02BFiyyah","Substitute signs of i\u02BFr\u0101b: letters like \u0648\u060C \u0627\u060C \u064A\u060C \u0646, or deleting a letter.","2.2",["\u0639\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0625\u0639\u0631\u0627\u0628 \u0627\u0644\u0641\u0631\u0639\u064A\u0629"])];var pd={"1.1":["Every Arabic word is one of three: \u0627\u0633\u0652\u0645\u060C \u0641\u0650\u0639\u0652\u0644\u060C \u062D\u064E\u0631\u0652\u0641. There is no fourth category.","\u0627\u0633\u0645: meaning in itself, not tied to time. \u0641\u0639\u0644: meaning tied to a time. \u062D\u0631\u0641: meaning only appears with other words.","Arabic \u0627\u0633\u0645 is much wider than English \u2018noun\u2019: adjectives, pronouns, demonstratives, participles and many adverbs are all \u0627\u0633\u0645.","\u0627\u0644\u0643\u064E\u0644\u0627\u0645 is a composed, meaningful utterance; \u0627\u0644\u0643\u064E\u0644\u0650\u0645\u064E\u0629 is a single word.","Egyptian \u0631\u0627\u064A\u062D and \u0641\u0627\u0647\u0645 are \u0627\u0633\u0645 (participles), even though English translates them as verbs."],"1.2":["Signs of the \u0627\u0633\u0645 (Ibn \u0100jurr\u016Bm): \u0627\u0644\u062E\u064E\u0641\u0652\u0636\u060C \u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646\u060C \u062F\u064F\u062E\u064F\u0648\u0644 \u0627\u0644\u0623\u0644\u0641 \u0648\u0627\u0644\u0644\u0627\u0645\u060C and the \u062D\u0631\u0648\u0641 \u0627\u0644\u062E\u0641\u0636 before it.","Later grammarians add \u0627\u0644\u0646\u0650\u0651\u062F\u0627\u0621 (being called: \u064A\u0627) and \u0627\u0644\u0625\u0650\u0633\u0652\u0646\u0627\u062F (being talked about).","Signs of the \u0641\u0639\u0644: \u0642\u064E\u062F\u0652\u060C \u0627\u0644\u0633\u0650\u0651\u064A\u0646\u060C \u0633\u064E\u0648\u0652\u0641\u064E\u060C \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629 (and for the command, accepting \u064A\u0627\u0621 \u0627\u0644\u0645\u062E\u0627\u0637\u0628\u0629).","A \u062D\u0631\u0641 is what accepts none of the noun\u2019s signs and none of the verb\u2019s.","One sign is enough to prove a word is a noun; a word can\u2019t carry both \u0627\u0644 and tanw\u012Bn at once."],"1.3":["\u062D\u0631\u0648\u0641 \u0627\u0644\u062C\u0631 make the following noun \u0645\u062C\u0631\u0648\u0631: \u0645\u0650\u0646\u060C \u0625\u0644\u0649\u060C \u0639\u064E\u0646\u060C \u0639\u0644\u0649\u060C \u0641\u064A\u060C \u0631\u064F\u0628\u064E\u0651\u060C \u0627\u0644\u0628\u0627\u0621\u060C \u0627\u0644\u0643\u0627\u0641\u060C \u0627\u0644\u0644\u0627\u0645.","\u062D\u0631\u0648\u0641 \u0627\u0644\u0639\u0637\u0641 link: \u0648\u060C \u0641\u0640\u060C \u062B\u064F\u0645\u064E\u0651\u060C \u0623\u064E\u0648\u0652\u060C \u0623\u064E\u0645\u0652\u060C \u0628\u064E\u0644\u0652\u060C \u0644\u0643\u0650\u0646\u0652\u060C \u0644\u0627\u060C \u062D\u064E\u062A\u064E\u0651\u0649.","\u062D\u0631\u0648\u0641 \u0627\u0644\u0646\u0641\u064A: \u0644\u0627\u060C \u0645\u0627\u060C \u0644\u064E\u0645\u0652\u060C \u0644\u064E\u0646\u0652. (\u0644\u064E\u064A\u0652\u0633\u064E looks like one but is a verb.)","\u062D\u0631\u0648\u0641 \u0627\u0644\u0627\u0633\u062A\u0641\u0647\u0627\u0645: \u0647\u064E\u0644\u0652 and the hamzah \u0623\u064E. \u0645\u064E\u0646\u060C \u0645\u0627\u060C \u0623\u064A\u0646\u060C \u0643\u064A\u0641 are question nouns, not particles.","\u062D\u0631\u0648\u0641 \u0627\u0644\u0646\u0635\u0628 (\u0623\u064E\u0646\u0652\u060C \u0644\u064E\u0646\u0652\u060C \u0643\u064E\u064A\u0652\u060C \u0625\u0650\u0630\u064E\u0646\u0652) and \u062D\u0631\u0648\u0641 \u0627\u0644\u062C\u0632\u0645 (\u0644\u064E\u0645\u0652\u060C \u0644\u064E\u0645\u0651\u0627\u060C \u0644\u0627\u0645 \u0627\u0644\u0623\u0645\u0631\u060C \u0644\u0627 \u0627\u0644\u0646\u0627\u0647\u064A\u0629) act on the present verb."],"1.4":["\u0645\u064F\u0641\u0652\u0631\u064E\u062F = one; \u0645\u064F\u062B\u064E\u0646\u064B\u0651\u0649 = two, marked \u0640\u0627\u0646\u0650 (raf\u02BF) or \u0640\u064E\u064A\u0652\u0646\u0650 (na\u1E63b/jarr); \u062C\u064E\u0645\u0652\u0639 = three or more.","\u062C\u0645\u0639 \u0627\u0644\u0645\u0630\u0643\u0631 \u0627\u0644\u0633\u0627\u0644\u0645: intact singular + \u0640\u064F\u0648\u0646\u064E / \u0640\u0650\u064A\u0646\u064E, mostly for male humans and their descriptions.","\u062C\u0645\u0639 \u0627\u0644\u0645\u0624\u0646\u062B \u0627\u0644\u0633\u0627\u0644\u0645: intact singular + \u0640\u0627\u062A (the \u0629 drops): \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064E\u0629 \u2190 \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0627\u062A.","\u062C\u0645\u0639 \u0627\u0644\u062A\u0643\u0633\u064A\u0631: the singular\u2019s internal shape breaks: \u0643\u0650\u062A\u0627\u0628 \u2190 \u0643\u064F\u062A\u064F\u0628\u060C \u0648\u064E\u0644\u064E\u062F \u2190 \u0623\u064E\u0648\u0652\u0644\u0627\u062F.","Egyptian uses only the \u0640\u064A\u0646 forms (\u0643\u062A\u0627\u0628\u064A\u0646\u060C \u0645\u062F\u0631\u0633\u064A\u0646), which match Fu\u1E63\u1E25\u0101\u2019s na\u1E63b/jarr shape."],"1.5":["Feminine markers on nouns: \u0627\u0644\u062A\u0627\u0621 \u0627\u0644\u0645\u0631\u0628\u0648\u0637\u0629 (\u0629), \u0627\u0644\u0623\u0644\u0641 \u0627\u0644\u0645\u0642\u0635\u0648\u0631\u0629 (\u0643\u064F\u0628\u0652\u0631\u064E\u0649), \u0627\u0644\u0623\u0644\u0641 \u0627\u0644\u0645\u0645\u062F\u0648\u062F\u0629 (\u0635\u064E\u062D\u0652\u0631\u0627\u0621).","Some nouns are feminine with no marker (\u0645\u0624\u0646\u062B \u0645\u0639\u0646\u0648\u064A): \u0634\u064E\u0645\u0652\u0633\u060C \u0623\u064E\u0631\u0652\u0636\u060C \u062F\u0627\u0631\u060C \u064A\u064E\u062F.","\u062D\u0642\u064A\u0642\u064A = biologically female; \u0645\u062C\u0627\u0632\u064A = grammatically feminine only (\u0634\u0645\u0633\u060C \u0633\u064A\u0627\u0631\u0629).","Verbs mark a feminine subject with \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629: \u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652.","\u0629 is pronounced \u0640\u0647 when you pause and \u062A when you connect; Egyptian keeps exactly this: \u0639\u0631\u0628\u064A\u0629 / \u0639\u0631\u0628\u064A\u0650\u0651\u0629 \u0645\u062D\u0645\u062F."],"1.6":["\u0646\u064E\u0643\u0650\u0631\u064E\u0629 = unspecified; \u0645\u064E\u0639\u0652\u0631\u0650\u0641\u064E\u0629 = specific and known.","The \u0645\u0639\u0627\u0631\u0641: \u0627\u0644\u0636\u0645\u064A\u0631\u060C \u0627\u0644\u0639\u064E\u0644\u064E\u0645\u060C \u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629\u060C \u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0645\u0648\u0635\u0648\u0644\u060C \u0627\u0644\u0645\u064F\u0639\u064E\u0631\u064E\u0651\u0641 \u0628\u0623\u0644\u060C \u0627\u0644\u0645\u0636\u0627\u0641 \u0625\u0644\u0649 \u0645\u0639\u0631\u0641\u0629 (and \u0627\u0644\u0645\u0646\u0627\u062F\u0649 \u0627\u0644\u0645\u0642\u0635\u0648\u062F).","Tanw\u012Bn usually signals a nakirah; \u0627\u0644 and tanw\u012Bn never appear together.","A proper name like \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C can carry tanw\u012Bn and still be ma\u02BFrifah: it is definite by being a name (\u0639\u064E\u0644\u064E\u0645).","Qur\u2019an 73:15\u201316 shows the pattern: \u0631\u064E\u0633\u064F\u0648\u0644\u064B\u0627 (first mention, nakirah) \u2192 \u0627\u0644\u0631\u064E\u0651\u0633\u064F\u0648\u0644\u064E (the same one, ma\u02BFrifah)."],"1.7":["\u0627\u0644\u062C\u0645\u0644\u0629 \u0627\u0644\u0627\u0633\u0645\u064A\u0629 starts with a noun: \u0645\u064F\u0628\u0652\u062A\u064E\u062F\u064E\u0623 + \u062E\u064E\u0628\u064E\u0631. \u0627\u0644\u062C\u0645\u0644\u0629 \u0627\u0644\u0641\u0639\u0644\u064A\u0629 starts with a verb: \u0641\u0650\u0639\u0652\u0644 + \u0641\u0627\u0639\u0650\u0644.","The mubtada\u02BE is normally ma\u02BFrifah and the khabar normally nakirah; both are \u0645\u0631\u0641\u0648\u0639.","The khabar agrees with the mubtada\u02BE in gender and number: \u0627\u0644\u0637\u0627\u0644\u0628\u0629\u064F \u0645\u062C\u062A\u0647\u062F\u0629\u064C.","\u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0630\u064E\u0647\u064E\u0628\u064E is, for the Ba\u1E63ran grammarians, a nominal sentence whose khabar is the verbal sentence \u0630\u064E\u0647\u064E\u0628\u064E.","Egyptian prefers noun-first order (\u0627\u0644\u0648\u0644\u062F \u0631\u0627\u062D); Fu\u1E63\u1E25\u0101 narration prefers verb-first (\u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F)."],"1.8":["Four labels: \u0645\u064E\u0631\u0652\u0641\u064F\u0648\u0639\u060C \u0645\u064E\u0646\u0652\u0635\u064F\u0648\u0628\u060C \u0645\u064E\u062C\u0652\u0631\u064F\u0648\u0631\u060C \u0645\u064E\u062C\u0652\u0632\u064F\u0648\u0645.","Nouns can be marf\u016B\u02BF, man\u1E63\u016Bb or majr\u016Br. Present verbs can be marf\u016B\u02BF, man\u1E63\u016Bb or majz\u016Bm.","First triggers: mubtada\u02BE, khabar, f\u0101\u02BFil \u2192 marf\u016B\u02BF; maf\u02BF\u016Bl bih \u2192 man\u1E63\u016Bb; after \u062D\u0631\u0641 \u062C\u0631 \u2192 majr\u016Br; after \u0644\u0645 \u2192 majz\u016Bm.","Chapter 2 explains the system behind these labels in depth."]},gd={"1.1":{sections:[{kind:"text",heading:"The idea",body:`Arabic grammar starts from one claim: every word you will ever meet is one of exactly three kinds. Ibn \u0100jurr\u016Bm opens his book with it:

\u0627\u0644\u0643\u064E\u0644\u0627\u0645\u064F \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u064E\u0651\u0641\u0652\u0638\u064F \u0627\u0644\u0645\u064F\u0631\u064E\u0643\u064E\u0651\u0628\u064F \u0627\u0644\u0645\u064F\u0641\u0650\u064A\u062F\u064F \u0628\u0650\u0627\u0644\u0648\u064E\u0636\u0652\u0639\u0650\u060C \u0648\u064E\u0623\u064E\u0642\u0652\u0633\u0627\u0645\u064F\u0647\u064F \u062B\u064E\u0644\u0627\u062B\u064E\u0629\u064C: \u0627\u0633\u0652\u0645\u064C\u060C \u0648\u064E\u0641\u0650\u0639\u0652\u0644\u064C\u060C \u0648\u064E\u062D\u064E\u0631\u0652\u0641\u064C \u062C\u0627\u0621\u064E \u0644\u0650\u0645\u064E\u0639\u0652\u0646\u064B\u0649

\u2018Speech is the utterance that is composed, gives a complete meaning, and uses the conventions of Arabic. Its categories are three: noun, verb, and a particle that comes for a meaning.\u2019

The test for each is simple. Does the word mean something by itself? If not, it\u2019s a \u062D\u0631\u0641. If it does, is that meaning tied to a time (past, present, command)? Then it\u2019s a \u0641\u0639\u0644. Otherwise it\u2019s an \u0627\u0633\u0645.`},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0627\u0644\u0643\u064E\u0644\u0650\u0645\u064E\u0629",tr:"al-kalimah",en:"a single word with a meaning"},{ar:"\u0627\u0644\u0643\u064E\u0644\u0627\u0645",tr:"al-kal\u0101m",en:"speech: a composed utterance giving a complete meaning"},{ar:"\u0627\u0644\u0644\u064E\u0651\u0641\u0652\u0638",tr:"al-laf\u1E93",en:"an utterance: sound made with the letters of speech"},{ar:"\u0627\u0633\u0652\u0645",tr:"ism",en:"noun (in the wide Arabic sense): meaning in itself, no time"},{ar:"\u0641\u0650\u0639\u0652\u0644",tr:"fi\u02BFl",en:"verb: meaning tied to a time"},{ar:"\u062D\u064E\u0631\u0652\u0641",tr:"\u1E25arf",en:"particle: meaning only with other words"},{ar:"\u0627\u0644\u0645\u064F\u0641\u0650\u064A\u062F",tr:"al-muf\u012Bd",en:"complete in meaning, so the listener isn\u2019t left waiting"}]},{kind:"examples",heading:"Examples",items:[{ar:"\u0643\u0650\u062A\u0627\u0628\u064C",eg:"\u0643\u062A\u0627\u0628",en:"a book",note:"Meaning by itself, no time \u2192 \u0627\u0633\u0645."},{ar:"\u0643\u064E\u062A\u064E\u0628\u064E",eg:"\u0643\u062A\u0628",en:"he wrote",note:"Meaning plus past time \u2192 \u0641\u0639\u0644."},{ar:"\u0641\u0650\u064A",eg:"\u0641\u064A",en:"in",note:"Say \u2018in\u2019 alone and nothing is understood until a noun follows \u2192 \u062D\u0631\u0641."},{ar:"\u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0645\u064E\u062F\u0652\u0631\u064E\u0633\u064E\u0629\u0650",eg:"\u0627\u0644\u0648\u0644\u062F \u0631\u0627\u062D \u0627\u0644\u0645\u062F\u0631\u0633\u0629",en:"The boy went to the school.",note:"\u0630\u064E\u0647\u064E\u0628\u064E \u0641\u0639\u0644\u060C \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0627\u0633\u0645\u060C \u0625\u0650\u0644\u064E\u0649 \u062D\u0631\u0641\u060C \u0627\u0644\u0645\u064E\u062F\u0652\u0631\u064E\u0633\u064E\u0629\u0650 \u0627\u0633\u0645. Notice Egyptian dropped the \u062D\u0631\u0641 \u0625\u0644\u0649 entirely."},{ar:"\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F \u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u064C",eg:"\u0627\u0644\u0637\u0627\u0644\u0628 \u0634\u0627\u0637\u0631",en:"The student is hardworking.",note:"\u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u064C is an adjective in English, but in Arabic grammar it is an \u0627\u0633\u0645."}]},{kind:"table",heading:"What counts as \u0627\u0633\u0645",head:["English calls it","Arabic calls it","Example"],rows:[["noun","\u0627\u0633\u0645","\u0628\u064E\u064A\u0652\u062A\u064C\u060C \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C"],["adjective","\u0627\u0633\u0645","\u0643\u064E\u0628\u0650\u064A\u0631\u064C\u060C \u062C\u064E\u0645\u0650\u064A\u0644\u064C"],["pronoun","\u0627\u0633\u0645","\u0647\u064F\u0648\u064E\u060C \u0623\u064E\u0646\u0627"],["demonstrative","\u0627\u0633\u0645","\u0647\u0670\u0630\u0627\u060C \u062A\u0650\u0644\u0652\u0643\u064E"],["participle (\u2018going\u2019, \u2018understanding\u2019)","\u0627\u0633\u0645","\u0630\u0627\u0647\u0650\u0628\u064C\u060C \u0641\u0627\u0647\u0650\u0645\u064C"],["many adverbs","\u0627\u0633\u0645","\u0627\u0644\u064A\u064E\u0648\u0652\u0645\u064E\u060C \u0639\u0650\u0646\u0652\u062F\u064E\u060C \u0641\u064E\u0648\u0652\u0642\u064E"]]},{kind:"text",heading:"Why it works this way",body:`The Arabic division is about **how a word carries meaning**, not about what the thing is. That\u2019s why so much lands in \u0627\u0633\u0645. An adjective like \u0643\u064E\u0628\u0650\u064A\u0631\u064C means \u2018big\u2019 by itself and has no time in it, so it is an \u0627\u0633\u0645 just like \u0628\u064E\u064A\u0652\u062A\u064C.

This matters immediately for i\u02BFr\u0101b: nouns and verbs take different case systems (you\u2019ll see in Chapter 2 that only nouns can be majr\u016Br and only verbs majz\u016Bm), so misclassifying a word means misreading its ending.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian uses the same three categories, but English translation hides them. In \u0623\u0646\u0627 \u0631\u0627\u064A\u062D \u0627\u0644\u0634\u063A\u0644, \u0631\u0627\u064A\u062D is translated \u2018going\u2019 and feels like a verb. Grammatically it is \u0627\u0633\u0645 \u0641\u0627\u0639\u0644, an active participle: a noun. Its Fu\u1E63\u1E25\u0101 form is \u0631\u0627\u0626\u0650\u062D / \u0630\u0627\u0647\u0650\u0628. The same is true of \u0641\u0627\u0647\u0645\u060C \u0639\u0627\u0631\u0641\u060C \u0633\u0627\u0643\u0646.

That\u2019s why you can say \u0623\u0646\u0627 \u0631\u0627\u064A\u062D without any time marker: the participle describes your state rather than stating a time-bound action.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C\uFD3E",ref:"S\u016Brat al-Ikhl\u0101\u1E63 112:1",en:"Say: He is Allah, One.",note:"\u0642\u064F\u0644\u0652 \u0641\u0639\u0644 (a command), \u0647\u064F\u0648\u064E \u0627\u0633\u0645 (pronoun), \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0627\u0633\u0645, \u0623\u064E\u062D\u064E\u062F\u064C \u0627\u0633\u0645."},{ar:"\uFD3F\u0644\u064E\u0645\u0652 \u064A\u064E\u0644\u0650\u062F\u0652 \u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064F\u0648\u0644\u064E\u062F\u0652\uFD3E",ref:"S\u016Brat al-Ikhl\u0101\u1E63 112:3",en:"He neither begets nor is born.",note:"\u0644\u064E\u0645\u0652 \u062D\u0631\u0641, \u064A\u064E\u0644\u0650\u062F\u0652 \u0641\u0639\u0644, \u0648\u064E \u062D\u0631\u0641, \u0644\u064E\u0645\u0652 \u062D\u0631\u0641, \u064A\u064F\u0648\u0644\u064E\u062F\u0652 \u0641\u0639\u0644."}]}],exercises:[{type:"mcq",prompt:"\u0643\u064E\u0628\u0650\u064A\u0631\u064C (big) is:",options:["\u0627\u0633\u0652\u0645","\u0641\u0650\u0639\u0652\u0644","\u062D\u064E\u0631\u0652\u0641"],answer:0,explanation:"Meaning by itself, no time. Arabic adjectives are \u0627\u0633\u0645."},{type:"mcq",prompt:"\u0639\u064E\u0644\u064E\u0649 (on) is:",options:["\u0627\u0633\u0652\u0645","\u0641\u0650\u0639\u0652\u0644","\u062D\u064E\u0631\u0652\u0641"],answer:2,explanation:"Its meaning only appears with the noun after it: \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0645\u064E\u0643\u0652\u062A\u064E\u0628\u0650."},{type:"mcq",prompt:"\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F (he writes) is:",options:["\u0627\u0633\u0652\u0645","\u0641\u0650\u0639\u0652\u0644","\u062D\u064E\u0631\u0652\u0641"],answer:1,explanation:"Meaning tied to present time \u2192 \u0641\u0639\u0644."},{type:"mcq",prompt:"Egyptian \u0631\u0627\u064A\u062D (going) is, grammatically:",options:["\u0627\u0633\u0652\u0645 (active participle)","\u0641\u0650\u0639\u0652\u0644 \u0645\u0636\u0627\u0631\u0639","\u062D\u064E\u0631\u0652\u0641"],answer:0,explanation:"It\u2019s \u0627\u0633\u0645 \u0641\u0627\u0639\u0644: a noun describing a state. The verb would be \u0628\u064A\u0631\u0648\u062D."},{type:"type",prompt:"A composed utterance that gives a complete, useful meaning. What is the Arabic term?",answers:["\u0627\u0644\u0643\u0644\u0627\u0645","\u0643\u0644\u0627\u0645"],explanation:"\u0627\u0644\u0643\u064E\u0644\u0627\u0645 (al-kal\u0101m)."},{type:"mcq",prompt:"How many words in \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F \u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 are \u0627\u0633\u0645?",options:["1","2","3"],answer:1,explanation:"\u0627\u0644\u0648\u064E\u0644\u064E\u062F\u064F and \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 are \u0627\u0633\u0645; \u0641\u0650\u064A is \u062D\u0631\u0641."},{type:"open",prompt:"Explain in your own words how you decide whether a word is \u0627\u0633\u0645, \u0641\u0639\u0644 or \u062D\u0631\u0641.",model:"If the word has no meaning by itself (it needs another word), it\u2019s a \u062D\u0631\u0641. If it has its own meaning and that meaning includes a time (past, present, command), it\u2019s a \u0641\u0639\u0644. If it has its own meaning with no time, it\u2019s an \u0627\u0633\u0645."}],review:[{type:"mcq",prompt:"Which of these is NOT an \u0627\u0633\u0645?",options:["\u0647\u0670\u0630\u0627","\u062C\u064E\u0645\u0650\u064A\u0644\u064C","\u062B\u064F\u0645\u064E\u0651","\u0627\u0644\u064A\u064E\u0648\u0652\u0645\u064E"],answer:2,explanation:"\u062B\u064F\u0645\u064E\u0651 (then) is a \u062D\u0631\u0641 \u0639\u0637\u0641."},{type:"mcq",prompt:"In Ibn \u0100jurr\u016Bm\u2019s definition, \u0627\u0644\u0645\u064F\u0631\u064E\u0643\u064E\u0651\u0628 means:",options:["composed of more than one word","correctly voweled","spoken aloud","in Arabic"],answer:0,explanation:"A single word isn\u2019t \u0643\u0644\u0627\u0645; it must be composed."}]},"1.2":{sections:[{kind:"text",heading:"The idea",body:`Once you know there are three categories, you need a way to prove which one a word belongs to. Arabic grammar gives **signs** (\u0639\u064E\u0644\u0627\u0645\u0627\u062A): things a word will accept only if it belongs to that category.

Ibn \u0100jurr\u016Bm lists the noun\u2019s signs:

\u0641\u064E\u0627\u0644\u0627\u0633\u0652\u0645\u064F \u064A\u064F\u0639\u0652\u0631\u064E\u0641\u064F \u0628\u0650\u0627\u0644\u062E\u064E\u0641\u0652\u0636\u0650 \u0648\u064E\u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646\u0650 \u0648\u064E\u062F\u064F\u062E\u064F\u0648\u0644\u0650 \u0627\u0644\u0623\u064E\u0644\u0650\u0641\u0650 \u0648\u064E\u0627\u0644\u0644\u0651\u0627\u0645\u0650\u060C \u0648\u064E\u062D\u064F\u0631\u064F\u0648\u0641\u0650 \u0627\u0644\u062E\u064E\u0641\u0652\u0636\u0650

\u2018The noun is known by khaf\u1E0D (jarr), tanw\u012Bn, the entry of alif-l\u0101m, and the particles of khaf\u1E0D.\u2019

And the verb\u2019s:

\u0648\u064E\u0627\u0644\u0641\u0650\u0639\u0652\u0644\u064F \u064A\u064F\u0639\u0652\u0631\u064E\u0641\u064F \u0628\u0650\u0642\u064E\u062F\u0652\u060C \u0648\u064E\u0627\u0644\u0633\u0650\u0651\u064A\u0646\u0650\u060C \u0648\u064E\u0633\u064E\u0648\u0652\u0641\u064E\u060C \u0648\u064E\u062A\u0627\u0621\u0650 \u0627\u0644\u062A\u064E\u0651\u0623\u0652\u0646\u0650\u064A\u062B\u0650 \u0627\u0644\u0633\u0651\u0627\u0643\u0650\u0646\u064E\u0629\u0650

\u2018The verb is known by \u0642\u064E\u062F\u0652, the \u0633\u064A\u0646, \u0633\u064E\u0648\u0652\u0641\u064E, and the silent feminine t\u0101\u02BE.\u2019

Then the particle, by elimination:

\u0648\u064E\u0627\u0644\u062D\u064E\u0631\u0652\u0641\u064F \u0645\u0627 \u0644\u0627 \u064A\u064E\u0635\u0652\u0644\u064F\u062D\u064F \u0645\u064E\u0639\u064E\u0647\u064F \u062F\u064E\u0644\u0650\u064A\u0644\u064F \u0627\u0644\u0627\u0633\u0652\u0645\u0650 \u0648\u064E\u0644\u0627 \u062F\u064E\u0644\u0650\u064A\u0644\u064F \u0627\u0644\u0641\u0650\u0639\u0652\u0644\u0650`},{kind:"table",heading:"The signs side by side",head:["Sign","Belongs to","Example"],rows:[["\u0627\u0644\u062C\u064E\u0631\u0651 / \u0627\u0644\u062E\u064E\u0641\u0652\u0636 (a kasrah ending from a jarr cause)","\u0627\u0633\u0645","\u0645\u064E\u0631\u064E\u0631\u0652\u062A\u064F \u0628\u0650\u0632\u064E\u064A\u0652\u062F\u064D"],["\u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646","\u0627\u0633\u0645","\u0643\u0650\u062A\u0627\u0628\u064C\u060C \u0642\u064E\u0644\u064E\u0645\u064B\u0627\u060C \u0628\u064E\u064A\u0652\u062A\u064D"],["\u0623\u0644 \u0627\u0644\u062A\u0639\u0631\u064A\u0641","\u0627\u0633\u0645","\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F"],["a \u062D\u0631\u0641 \u062C\u0631 before it","\u0627\u0633\u0645","\u0641\u0650\u064A \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650"],["\u0627\u0644\u0646\u0650\u0651\u062F\u0627\u0621 (being called with \u064A\u0627)","\u0627\u0633\u0645","\u064A\u0627 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064F"],["\u0627\u0644\u0625\u0650\u0633\u0652\u0646\u0627\u062F (being talked about)","\u0627\u0633\u0645","\u0623\u064E\u0646\u0627 \u0637\u0627\u0644\u0650\u0628\u064C: \u0623\u0646\u0627 is talked about"],["\u0642\u064E\u062F\u0652","\u0641\u0639\u0644","\u0642\u064E\u062F\u0652 \u0643\u064E\u062A\u064E\u0628\u064E"],["\u0627\u0644\u0633\u0650\u0651\u064A\u0646 / \u0633\u064E\u0648\u0652\u0641\u064E","\u0641\u0639\u0644 (present)","\u0633\u064E\u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F\u060C \u0633\u064E\u0648\u0652\u0641\u064E \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064F"],["\u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629","\u0641\u0639\u0644 (past)","\u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652"],["none of the above","\u062D\u0631\u0641","\u0641\u0650\u064A\u060C \u0644\u064E\u0645\u0652\u060C \u0647\u064E\u0644\u0652"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0627\u0633\u0652\u0645",tr:"\u02BFal\u0101m\u0101t al-ism",en:"signs that prove a word is a noun"},{ar:"\u0639\u064E\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u0641\u0650\u0639\u0652\u0644",tr:"\u02BFal\u0101m\u0101t al-fi\u02BFl",en:"signs that prove a word is a verb"},{ar:"\u0623\u064E\u0644\u0652 \u0627\u0644\u062A\u064E\u0651\u0639\u0652\u0631\u0650\u064A\u0641",tr:"al at-ta\u02BFr\u012Bf",en:"the definite article"},{ar:"\u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646",tr:"at-tanw\u012Bn",en:"the extra n sound at a noun\u2019s end, written as a doubled vowel"},{ar:"\u0627\u0644\u0646\u0650\u0651\u062F\u0627\u0621",tr:"an-nid\u0101\u02BE",en:"calling someone: \u064A\u0627"},{ar:"\u0627\u0644\u0625\u0650\u0633\u0652\u0646\u0627\u062F",tr:"al-isn\u0101d",en:"attributing something to a word (talking about it)"},{ar:"\u0642\u064E\u062F\u0652",tr:"qad",en:"particle of certainty or \u2018already\u2019, only before verbs"}]},{kind:"examples",heading:"Examples",items:[{ar:"\u0647\u0670\u0630\u0627 {r:\u0643\u0650\u062A\u0627\u0628\u064C}",eg:"\u062F\u0647 \u0643\u062A\u0627\u0628",en:"This is a book.",note:"\u0643\u0650\u062A\u0627\u0628\u064C has tanw\u012Bn \u2192 it must be a noun."},{ar:"\u0642\u064E\u0631\u064E\u0623\u0652\u062A\u064F \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064E",eg:"\u0642\u0631\u064A\u062A \u0627\u0644\u0643\u062A\u0627\u0628",en:"I read the book.",note:"\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064E takes \u0627\u0644 \u2192 noun."},{ar:"\u0642\u064E\u062F\u0652 \u0646\u064E\u062C\u064E\u062D\u064E \u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064F",eg:"\u0627\u0644\u0637\u0627\u0644\u0628 \u0646\u062C\u062D \u062E\u0644\u0627\u0635",en:"The student has (indeed) passed.",note:"\u0642\u064E\u062F\u0652 proves \u0646\u064E\u062C\u064E\u062D\u064E is a verb."},{ar:"\u0633\u064E\u064A\u064E\u0633\u0627\u0641\u0650\u0631\u064F \u0623\u064E\u0628\u0650\u064A \u063A\u064E\u062F\u064B\u0627",eg:"\u0623\u0628\u0648\u064A\u0627 \u0647\u064A\u0633\u0627\u0641\u0631 \u0628\u0643\u0631\u0629",en:"My father will travel tomorrow.",note:"The \u0633\u064A\u0646 proves \u064A\u064F\u0633\u0627\u0641\u0650\u0631\u064F is a verb. Egyptian \u0647\u0640 does the same job."},{ar:"\u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652 \u0641\u0627\u0637\u0650\u0645\u064E\u0629\u064F",eg:"\u0641\u0627\u0637\u0645\u0629 \u0643\u062A\u0628\u062A",en:"F\u0101\u1E6Dimah wrote.",note:"The silent \u062A on \u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652 proves it is a (past) verb."}]},{kind:"text",heading:"Why it works this way",body:`Each sign only fits one category because of what it means. \u0627\u0644 makes a thing specific, and only things can be specific, so only nouns take it. \u0642\u064E\u062F\u0652 and \u0633\u064E\u0648\u0652\u0641\u064E are about when an action happens, so only verbs take them. Jarr is the effect of a preposition or of possession, both of which only link to things.

**One sign is enough.** You don\u2019t need a word to accept all the signs; one proves it. But certain signs block others: a word never has \u0627\u0644 and tanw\u012Bn together (\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F or \u0643\u0650\u062A\u0627\u0628\u064C, never \u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064C), because \u0627\u0644 makes it definite and tanw\u012Bn (in most nouns) marks it indefinite.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian keeps \u0627\u0644 (pronounced el-, and assimilated as in \u0627\u0644\u0634\u0645\u0633: esh-shams) and keeps the prepositions, so two noun tests work directly in your Egyptian ear: could it take \u0627\u0644? Could it follow \u0641\u064A or \u0645\u0646?

Egyptian has no audible tanw\u012Bn outside fossils (\u0634\u0643\u0631\u064B\u0627\u060C \u0623\u0628\u062F\u064B\u0627) and doesn\u2019t use \u0642\u062F or \u0633\u0648\u0641 in speech. It has its own verb signs instead: \u0628\u0640 (\u0628\u064A\u0643\u062A\u0628) and \u0647\u0640 (\u0647\u064A\u0643\u062A\u0628) only attach to verbs, so they work as an Egyptian \u2018verb test\u2019.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u0631\u064E\u0651\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062D\u0650\u064A\u0645\u0650\uFD3E",ref:"S\u016Brat al-F\u0101ti\u1E25ah 1:1",en:"In the name of Allah, the Most Merciful, the Especially Merciful.",note:"\u0627\u0633\u0652\u0645\u0650 follows the \u062D\u0631\u0641 \u062C\u0631 \u0628\u0650\u0640 (noun sign). \u0627\u0644\u0631\u064E\u0651\u062D\u0652\u0645\u064E\u0670\u0646\u0650 and \u0627\u0644\u0631\u064E\u0651\u062D\u0650\u064A\u0645\u0650 carry \u0627\u0644 (noun sign). All three end in kasrah: jarr, another noun sign."},{ar:"\uFD3F\u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E\uFD3E",ref:"S\u016Brat al-Mu\u02BEmin\u016Bn 23:1",en:"The believers have certainly succeeded.",note:"\u0642\u064E\u062F\u0652 proves \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E is a verb."},{ar:"\uFD3F\u064A\u064E\u0627 \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u0646\u064E\u0651\u0627\u0633\u064F \u0627\u0639\u0652\u0628\u064F\u062F\u064F\u0648\u0627 \u0631\u064E\u0628\u064E\u0651\u0643\u064F\u0645\u064F\uFD3E",ref:"S\u016Brat al-Baqarah 2:21 (opening)",en:"O people, worship your Lord.",note:"\u0627\u0644\u0646\u0650\u0651\u062F\u0627\u0621: \u064A\u0627 calls out, and what is called is a noun."}]}],exercises:[{type:"mcq",prompt:"Which sign proves \u0643\u0650\u062A\u0627\u0628\u064C is a noun?",options:["\u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646","\u0642\u064E\u062F\u0652","\u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629","\u0627\u0644\u0633\u0650\u0651\u064A\u0646"],answer:0,explanation:"The -un ending is tanw\u012Bn, a noun sign."},{type:"mcq",prompt:"Which of these is a sign of the verb?",options:["\u0623\u0644","\u0633\u064E\u0648\u0652\u0641\u064E","\u062D\u0631\u0641 \u0627\u0644\u062C\u0631","\u0627\u0644\u062A\u064E\u0651\u0646\u0652\u0648\u0650\u064A\u0646"],answer:1,explanation:"\u0633\u064E\u0648\u0652\u0641\u064E points to future time; only verbs have time."},{type:"type",prompt:"Calling someone with \u064A\u0627; a sign of the noun. What is the Arabic term?",answers:["\u0627\u0644\u0646\u062F\u0627\u0621","\u0646\u062F\u0627\u0621"],explanation:"\u0627\u0644\u0646\u0650\u0651\u062F\u0627\u0621 (an-nid\u0101\u02BE)."},{type:"mcq",prompt:"\u0643\u064E\u062A\u064E\u0628\u064E\u062A\u0652: what shows it is a verb?",options:["the silent \u062A at the end","the fat\u1E25ah on \u0643","it has three root letters","nothing; it\u2019s a noun"],answer:0,explanation:"\u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B \u0627\u0644\u0633\u0627\u0643\u0646\u0629 only attaches to past verbs."},{type:"mcq",prompt:"Which form is impossible?",options:["\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064F","\u0643\u0650\u062A\u0627\u0628\u064C","\u0627\u0644\u0643\u0650\u062A\u0627\u0628\u064C","\u0643\u0650\u062A\u0627\u0628\u064B\u0627"],answer:2,explanation:"\u0627\u0644 and tanw\u012Bn never combine."},{type:"mcq",prompt:"In Egyptian, which prefix works as a verb test?",options:["\u0628\u0640 as in \u0628\u064A\u0643\u062A\u0628","\u0627\u0644\u0640 as in \u0627\u0644\u0643\u062A\u0627\u0628","\u0644\u0640 as in \u0644\u0644\u0628\u064A\u062A","none"],answer:0,explanation:"\u0628\u0640 and \u0647\u0640 only attach to present verbs in Egyptian."},{type:"open",prompt:"Prove that \u0647\u064E\u0644\u0652 is a \u062D\u0631\u0641 using the signs.",model:"\u0647\u064E\u0644\u0652 accepts none of the noun\u2019s signs (no \u0627\u0644, no tanw\u012Bn, can\u2019t follow a preposition, can\u2019t be called or talked about) and none of the verb\u2019s (no \u0642\u062F, \u0633\u064A\u0646, \u0633\u0648\u0641 or \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B). By elimination it is a \u062D\u0631\u0641."}],review:[{type:"type",prompt:"The particle of certainty that only precedes verbs (as in \uFD3F\u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E\uFD3E). Write it.",answers:["\u0642\u062F"],explanation:"\u0642\u064E\u062F\u0652."},{type:"mcq",prompt:"The \u062D\u0631\u0641 is identified by:",options:["accepting none of the noun or verb signs","always having a suk\u016Bn","being one letter long","ending in tanw\u012Bn"],answer:0,explanation:"\u0648\u064E\u0627\u0644\u062D\u064E\u0631\u0652\u0641\u064F \u0645\u0627 \u0644\u0627 \u064A\u064E\u0635\u0652\u0644\u064F\u062D\u064F \u0645\u064E\u0639\u064E\u0647\u064F \u062F\u064E\u0644\u0650\u064A\u0644\u064F \u0627\u0644\u0627\u0633\u0652\u0645\u0650 \u0648\u064E\u0644\u0627 \u062F\u064E\u0644\u0650\u064A\u0644\u064F \u0627\u0644\u0641\u0650\u0639\u0652\u0644\u0650."}]},"1.3":{sections:[{kind:"text",heading:"The idea",body:"Particles are few but everywhere. Grammar books group them by **what they do**, and several groups act on the word after them, changing its ending. Learn them as families; you\u2019ll meet each family again when its effect is taught in depth."},{kind:"table",heading:"The six families",head:["Family","Members","What they do"],rows:[["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0631\u0651","\u0645\u0650\u0646\u0652\u060C \u0625\u0650\u0644\u064E\u0649\u060C \u0639\u064E\u0646\u0652\u060C \u0639\u064E\u0644\u064E\u0649\u060C \u0641\u0650\u064A\u060C \u0631\u064F\u0628\u064E\u0651\u060C \u0628\u0650\u0640\u060C \u0643\u064E\u0640\u060C \u0644\u0650\u0640","make the next noun \u0645\u062C\u0631\u0648\u0631"],["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0639\u064E\u0637\u0652\u0641","\u0648\u064E\u060C \u0641\u064E\u0640\u060C \u062B\u064F\u0645\u064E\u0651\u060C \u0623\u064E\u0648\u0652\u060C \u0623\u064E\u0645\u0652\u060C \u0628\u064E\u0644\u0652\u060C \u0644\u0670\u0643\u0650\u0646\u0652\u060C \u0644\u0627\u060C \u062D\u064E\u062A\u064E\u0651\u0649","link words; the second copies the first\u2019s case"],["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0641\u0652\u064A","\u0644\u0627\u060C \u0645\u0627\u060C \u0644\u064E\u0645\u0652\u060C \u0644\u064E\u0646\u0652","negate"],["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0627\u0633\u0652\u062A\u0650\u0641\u0652\u0647\u0627\u0645","\u0647\u064E\u0644\u0652\u060C \u0623\u064E","ask yes/no questions"],["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","\u0623\u064E\u0646\u0652\u060C \u0644\u064E\u0646\u0652\u060C \u0643\u064E\u064A\u0652\u060C \u0625\u0650\u0630\u064E\u0646\u0652","make the present verb \u0645\u0646\u0635\u0648\u0628"],["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0632\u0652\u0645","\u0644\u064E\u0645\u0652\u060C \u0644\u064E\u0645\u0651\u0627\u060C \u0644\u0627\u0645 \u0627\u0644\u0623\u0645\u0631\u060C \u0644\u0627 \u0627\u0644\u0646\u0627\u0647\u064A\u0629","make the present verb \u0645\u062C\u0632\u0648\u0645"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u062D\u064E\u0631\u0652\u0641 \u0627\u0644\u062C\u064E\u0631\u0651",tr:"\u1E25arf al-jarr",en:"preposition"},{ar:"\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0639\u064E\u0637\u0652\u0641",tr:"\u1E25ur\u016Bf al-\u02BFa\u1E6Df",en:"conjunctions"},{ar:"\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0641\u0652\u064A",tr:"\u1E25ur\u016Bf an-nafy",en:"negation particles"},{ar:"\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0627\u0633\u0652\u062A\u0650\u0641\u0652\u0647\u0627\u0645",tr:"\u1E25ur\u016Bf al-istifh\u0101m",en:"question particles"},{ar:"\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628",tr:"\u1E25ur\u016Bf an-na\u1E63b",en:"particles that make the present verb man\u1E63\u016Bb"},{ar:"\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0632\u0652\u0645",tr:"\u1E25ur\u016Bf al-jazm",en:"particles that make the present verb majz\u016Bm"}]},{kind:"examples",heading:"Examples",items:[{ar:"\u062E\u064E\u0631\u064E\u062C\u0652\u062A\u064F \u0645\u0650\u0646\u064E {j:\u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650}",eg:"\u062E\u0631\u062C\u062A \u0645\u0646 \u0627\u0644\u0628\u064A\u062A",en:"I left the house.",note:"\u0645\u0650\u0646 \u2192 \u0627\u0644\u0628\u064E\u064A\u0652\u062A\u0650 is majr\u016Br (kasrah)."},{ar:"\u062C\u0627\u0621\u064E \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C \u0648\u064E{r:\u0639\u064E\u0644\u0650\u064A\u064C\u0651}",eg:"\u0645\u062D\u0645\u062F \u0648\u0639\u0644\u064A \u062C\u0645",en:"Mu\u1E25ammad and \u02BFAl\u012B came.",note:"\u0648 links; \u0639\u064E\u0644\u0650\u064A\u064C\u0651 copies the \u1E0Dammah of \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C."},{ar:"\u0647\u064E\u0644\u0652 \u0641\u064E\u0647\u0650\u0645\u0652\u062A\u064E \u0627\u0644\u062F\u064E\u0651\u0631\u0652\u0633\u064E\u061F",eg:"\u0641\u0647\u0645\u062A \u0627\u0644\u062F\u0631\u0633\u061F",en:"Did you understand the lesson?",note:"Fu\u1E63\u1E25\u0101 uses \u0647\u064E\u0644\u0652; Egyptian usually uses intonation alone."},{ar:"\u0644\u064E\u0646\u0652 {n:\u0623\u064F\u0633\u0627\u0641\u0650\u0631\u064E}",eg:"\u0645\u0634 \u0647\u0633\u0627\u0641\u0631",en:"I will not travel.",note:"\u0644\u0646 negates the future and makes the verb man\u1E63\u016Bb."},{ar:"\u0644\u064E\u0645\u0652 {z:\u0623\u064E\u0641\u0652\u0647\u064E\u0645\u0652}",eg:"\u0645\u0641\u0647\u0645\u062A\u0634",en:"I didn\u2019t understand.",note:"\u0644\u0645 negates the past (using the present form) and makes it majz\u016Bm."},{ar:"\u0644\u0627 {z:\u062A\u064E\u0643\u0652\u0630\u0650\u0628\u0652}",eg:"\u0645\u062A\u0643\u062F\u0628\u0634",en:"Don\u2019t lie.",note:"\u0644\u0627 \u0627\u0644\u0646\u0627\u0647\u064A\u0629 (prohibition) \u2192 majz\u016Bm."}]},{kind:"text",heading:"Why it works this way",body:`**Particles that act vs particles that don\u2019t.** A preposition changes the noun after it; a conjunction passes the previous case along; a question particle like \u0647\u064E\u0644\u0652 changes nothing. Traditional books call acting particles \u0639\u0627\u0645\u0650\u0644\u064E\u0629 and non-acting ones \u063A\u064E\u064A\u0652\u0631 \u0639\u0627\u0645\u0650\u0644\u064E\u0629 (or \u0645\u064F\u0647\u0652\u0645\u064E\u0644\u064E\u0629). Learn which is which now and later chapters click faster.

**Watch the look-alikes.**
- \u0644\u0627 has three jobs: plain negation (\u0644\u0627 \u0623\u064E\u0639\u0652\u0631\u0650\u0641\u064F, no effect), prohibition (\u0644\u0627 \u062A\u064E\u0643\u0652\u0630\u0650\u0628\u0652, jazm), and conjunction (\u062C\u0627\u0621\u064E \u0632\u064E\u064A\u0652\u062F\u064C \u0644\u0627 \u0639\u064E\u0645\u0652\u0631\u064C\u0648).
- \u0644\u064E\u064A\u0652\u0633\u064E negates, but it is a verb, not a \u062D\u0631\u0641: it takes \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B (\u0644\u064E\u064A\u0652\u0633\u064E\u062A\u0652). You\u2019ll study it in Chapter 4.
- Question words like \u0645\u064E\u0646\u0652\u060C \u0645\u0627\u060C \u0623\u064E\u064A\u0652\u0646\u064E\u060C \u0643\u064E\u064A\u0652\u0641\u064E\u060C \u0645\u064E\u062A\u064E\u0649 are nouns (\u0623\u0633\u0645\u0627\u0621 \u0627\u0644\u0627\u0633\u062A\u0641\u0647\u0627\u0645), not particles.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian keeps \u0645\u0650\u0646\u060C \u0641\u064A\u060C \u0639\u0644\u0649\u060C \u0639\u0646 and \u0644\u0640, drops \u0625\u0644\u0649 (\u0631\u0627\u062D \u0627\u0644\u0645\u062F\u0631\u0633\u0629), and adds \u0644\u0650\u062D\u064E\u062F\u0651 for \u2018until\u2019.

Negation is where the systems part ways. Fu\u1E63\u1E25\u0101 uses four particles with different effects; Egyptian mostly uses \u0645\u0627\u2026\u0634 around a verb (\u0645\u0641\u0647\u0645\u062A\u0634) and \u0645\u0650\u0634 before other words (\u0645\u0634 \u0647\u0633\u0627\u0641\u0631\u060C \u0645\u0634 \u0641\u0627\u0647\u0645). When you see \u0644\u0645 in Fu\u1E63\u1E25\u0101, think \u0645\u0627\u2026\u0634 on a past verb; when you see \u0644\u0646, think \u0645\u0634 + \u0647\u0640.

Egyptian question words are different nouns altogether: \u0625\u064A\u0647 = \u0645\u0627\u0630\u0627 / \u0645\u0627\u060C \u0641\u064A\u0646 = \u0623\u064A\u0646\u060C \u0625\u0645\u062A\u0649 = \u0645\u062A\u0649\u060C \u0625\u0632\u0627\u064A = \u0643\u064A\u0641.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0644\u064E\u0646\u0652 \u062A\u064E\u0646\u064E\u0627\u0644\u064F\u0648\u0627 \u0627\u0644\u0652\u0628\u0650\u0631\u064E\u0651 \u062D\u064E\u062A\u064E\u0651\u0649\u0670 \u062A\u064F\u0646\u0652\u0641\u0650\u0642\u064F\u0648\u0627 \u0645\u0650\u0645\u064E\u0651\u0627 \u062A\u064F\u062D\u0650\u0628\u064F\u0651\u0648\u0646\u064E\uFD3E",ref:"S\u016Brat \u0100l \u02BFImr\u0101n 3:92",en:"You will never attain righteousness until you spend from what you love.",note:"\u0644\u064E\u0646\u0652 is a \u062D\u0631\u0641 \u0646\u0635\u0628 and negation. \u0645\u0650\u0645\u064E\u0651\u0627 = \u0645\u0650\u0646\u0652 + \u0645\u0627."},{ar:"\uFD3F\u0647\u064E\u0644\u0652 \u0623\u064E\u062A\u064E\u0627\u0643\u064E \u062D\u064E\u062F\u0650\u064A\u062B\u064F \u0645\u064F\u0648\u0633\u064E\u0649\u0670\uFD3E",ref:"S\u016Brat an-N\u0101zi\u02BF\u0101t 79:15",en:"Has the story of M\u016Bs\u0101 reached you?",note:"\u0647\u064E\u0644\u0652 is a \u062D\u0631\u0641 \u0627\u0633\u062A\u0641\u0647\u0627\u0645 with no effect on case."}]}],exercises:[{type:"mcq",prompt:"Which family does \u0639\u064E\u0646\u0652 belong to?",options:["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0631\u0651","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0639\u064E\u0637\u0652\u0641","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0641\u0652\u064A","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0632\u0652\u0645"],answer:0,explanation:"\u0639\u064E\u0646\u0652 is a preposition."},{type:"mcq",prompt:"Which of these is a \u062D\u0631\u0641 \u062C\u0632\u0645?",options:["\u0644\u064E\u0646\u0652","\u0644\u064E\u0645\u0652","\u0623\u064E\u0646\u0652","\u0647\u064E\u0644\u0652"],answer:1,explanation:"\u0644\u064E\u0645\u0652 makes the present verb majz\u016Bm. \u0644\u064E\u0646\u0652 and \u0623\u064E\u0646\u0652 are \u062D\u0631\u0648\u0641 \u0646\u0635\u0628."},{type:"mcq",prompt:"\u0644\u064E\u064A\u0652\u0633\u064E is:",options:["a \u062D\u0631\u0641 \u0646\u0641\u064A","a verb","a noun","a \u062D\u0631\u0641 \u062C\u0631"],answer:1,explanation:"It takes \u062A\u0627\u0621 \u0627\u0644\u062A\u0623\u0646\u064A\u062B (\u0644\u064E\u064A\u0652\u0633\u064E\u062A\u0652), a verb sign."},{type:"mcq",prompt:"In \u0644\u0627 \u062A\u064E\u0643\u0652\u0630\u0650\u0628\u0652, the \u0644\u0627 is:",options:["\u0644\u0627 \u0627\u0644\u0646\u0627\u0647\u064A\u0629, a \u062D\u0631\u0641 \u062C\u0632\u0645","plain negation with no effect","a conjunction","a noun"],answer:0,explanation:"It forbids, and the verb is majz\u016Bm (suk\u016Bn on the \u0628)."},{type:"type",prompt:"Egyptian \u0645\u0641\u0647\u0645\u062A\u0634. Write the Fu\u1E63\u1E25\u0101 with \u0644\u0645 (vowels optional).",answers:["\u0644\u0645 \u0623\u0641\u0647\u0645"],explanation:"\u0644\u064E\u0645\u0652 \u0623\u064E\u0641\u0652\u0647\u064E\u0645\u0652."},{type:"mcq",prompt:"\u0643\u064E\u064A\u0652\u0641\u064E (how) is:",options:["a \u062D\u0631\u0641 \u0627\u0633\u062A\u0641\u0647\u0627\u0645","an \u0627\u0633\u0645 \u0627\u0633\u062A\u0641\u0647\u0627\u0645","a \u0641\u0639\u0644"],answer:1,explanation:"Only \u0647\u0644 and the hamzah are question particles; \u0643\u064A\u0641 is a question noun."},{type:"open",prompt:"What is the difference in meaning and effect between \u0644\u064E\u0645\u0652 \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u0652 and \u0644\u064E\u0646\u0652 \u064A\u064E\u0643\u0652\u062A\u064F\u0628\u064E?",model:"\u0644\u064E\u0645\u0652 negates the past (\u2018he did not write\u2019) and makes the verb majz\u016Bm with suk\u016Bn. \u0644\u064E\u0646\u0652 negates the future (\u2018he will not write\u2019) and makes it man\u1E63\u016Bb with fat\u1E25ah."}],review:[{type:"mcq",prompt:"Which particle family makes the following noun majr\u016Br?",options:["\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u062C\u064E\u0631\u0651","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0646\u064E\u0651\u0635\u0652\u0628","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0639\u064E\u0637\u0652\u0641","\u062D\u064F\u0631\u064F\u0648\u0641 \u0627\u0644\u0627\u0633\u0652\u062A\u0650\u0641\u0652\u0647\u0627\u0645"],answer:0,explanation:""},{type:"mcq",prompt:"\u062B\u064F\u0645\u064E\u0651 means:",options:["then (after a gap)","or","but","in"],answer:0,explanation:"A conjunction of sequence with delay; \u0641\u064E\u0640 is immediate sequence."}]},"1.4":{sections:[{kind:"text",heading:"The idea",body:"Arabic counts in three steps: one, two, and more than two. Where English has singular and plural, Arabic has **\u0645\u064F\u0641\u0652\u0631\u064E\u062F**, **\u0645\u064F\u062B\u064E\u0646\u064B\u0651\u0649** and **\u062C\u064E\u0645\u0652\u0639**, and the plural itself comes in three kinds."},{kind:"table",heading:"Number at a glance",head:["Type","How it\u2019s made","Example"],rows:[["\u0645\u064F\u0641\u0652\u0631\u064E\u062F","the base word","\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064C\u060C \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064E\u0629\u064C\u060C \u0643\u0650\u062A\u0627\u0628\u064C"],["\u0645\u064F\u062B\u064E\u0646\u064B\u0651\u0649","add \u0640\u0627\u0646\u0650 (raf\u02BF) or \u0640\u064E\u064A\u0652\u0646\u0650 (na\u1E63b/jarr)","\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0627\u0646\u0650 / \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064E\u064A\u0652\u0646\u0650"],["\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u0645\u064F\u0630\u064E\u0643\u064E\u0651\u0631 \u0627\u0644\u0633\u0651\u0627\u0644\u0650\u0645","add \u0640\u064F\u0648\u0646\u064E (raf\u02BF) or \u0640\u0650\u064A\u0646\u064E (na\u1E63b/jarr)","\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F\u0648\u0646\u064E / \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0650\u064A\u0646\u064E"],["\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u0645\u064F\u0624\u064E\u0646\u064E\u0651\u062B \u0627\u0644\u0633\u0651\u0627\u0644\u0650\u0645","drop \u0629, add \u0640\u0627\u062A\u064C","\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u0627\u062A\u064C"],["\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u062A\u064E\u0651\u0643\u0652\u0633\u0650\u064A\u0631","change the internal shape","\u0643\u064F\u062A\u064F\u0628\u064C\u060C \u0623\u064E\u0648\u0652\u0644\u0627\u062F\u064C\u060C \u0631\u0650\u062C\u0627\u0644\u064C"]]},{kind:"terms",heading:"Terms to own",items:[{ar:"\u0645\u064F\u0641\u0652\u0631\u064E\u062F",tr:"mufrad",en:"singular"},{ar:"\u0645\u064F\u062B\u064E\u0646\u064B\u0651\u0649",tr:"muthann\u0101",en:"dual (exactly two)"},{ar:"\u062C\u064E\u0645\u0652\u0639",tr:"jam\u02BF",en:"plural (three or more)"},{ar:"\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u0645\u064F\u0630\u064E\u0643\u064E\u0651\u0631 \u0627\u0644\u0633\u0651\u0627\u0644\u0650\u0645",tr:"jam\u02BF al-mudhakkar as-s\u0101lim",en:"sound masculine plural (\u2018safe\u2019: the singular stays intact)"},{ar:"\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u0645\u064F\u0624\u064E\u0646\u064E\u0651\u062B \u0627\u0644\u0633\u0651\u0627\u0644\u0650\u0645",tr:"jam\u02BF al-mu\u02BEannath as-s\u0101lim",en:"sound feminine plural"},{ar:"\u062C\u064E\u0645\u0652\u0639 \u0627\u0644\u062A\u064E\u0651\u0643\u0652\u0633\u0650\u064A\u0631",tr:"jam\u02BF at-taks\u012Br",en:"broken plural (\u2018broken\u2019: the singular\u2019s shape changes)"}]},{kind:"examples",heading:"Examples",items:[{ar:"\u062C\u0627\u0621\u064E {r:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u0627\u0646\u0650}",eg:"\u0627\u0644\u0637\u0627\u0644\u0628\u064A\u0646 \u062C\u0645",en:"The two students came.",note:"Dual in raf\u02BF: \u0640\u0627\u0646\u0650."},{ar:"\u0631\u064E\u0623\u064E\u064A\u0652\u062A\u064F {n:\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u064E\u064A\u0652\u0646\u0650}",eg:"\u0634\u0641\u062A \u0627\u0644\u0637\u0627\u0644\u0628\u064A\u0646",en:"I saw the two students.",note:"Dual in na\u1E63b: \u0640\u064E\u064A\u0652\u0646\u0650."},{ar:"{r:\u0627\u0644\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F\u0648\u0646\u064E} \u0635\u0627\u0626\u0650\u0645\u064F\u0648\u0646\u064E",eg:"\u0627\u0644\u0645\u0633\u0644\u0645\u064A\u0646 \u0635\u0627\u064A\u0645\u064A\u0646",en:"The Muslims are fasting.",note:"Sound masculine plural in raf\u02BF: \u0640\u064F\u0648\u0646\u064E."},{ar:"\u0641\u0650\u064A {j:\u0627\u0644\u0645\u064E\u062F\u0627\u0631\u0650\u0633\u0650}",eg:"\u0641\u064A \u0627\u0644\u0645\u062F\u0627\u0631\u0633",en:"in the schools",note:"\u0645\u064E\u062F\u0652\u0631\u064E\u0633\u064E\u0629 \u2192 \u0645\u064E\u062F\u0627\u0631\u0650\u0633, a broken plural."},{ar:"\u0627\u0644\u0637\u0651\u0627\u0644\u0650\u0628\u0627\u062A\u064F \u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u0627\u062A\u064C",eg:"\u0627\u0644\u0637\u0627\u0644\u0628\u0627\u062A \u0634\u0627\u0637\u0631\u064A\u0646",en:"The (female) students are hardworking.",note:"Sound feminine plural: \u0640\u0627\u062A. Egyptian often switches the adjective to \u0640\u064A\u0646."}]},{kind:"text",heading:"Why it works this way",body:`**Why \u2018sound\u2019 and \u2018broken\u2019?** \u0633\u0627\u0644\u0650\u0645 means safe: the singular survives untouched inside the plural (\u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645 \u2192 \u0645\u064F\u0639\u064E\u0644\u0650\u0651\u0645\u064F\u0648\u0646\u064E). \u062A\u064E\u0643\u0652\u0633\u0650\u064A\u0631 means breaking: the vowels and sometimes letters inside the word change (\u0642\u064E\u0644\u064E\u0645 \u2192 \u0623\u064E\u0642\u0652\u0644\u0627\u0645).

**Who gets which plural?** \u062C\u0645\u0639 \u0627\u0644\u0645\u0630\u0643\u0631 \u0627\u0644\u0633\u0627\u0644\u0645 is mostly for names and descriptions of male humans (\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F\u0648\u0646\u064E\u060C \u0645\u064F\u0647\u064E\u0646\u0652\u062F\u0650\u0633\u064F\u0648\u0646\u064E). \u062C\u0645\u0639 \u0627\u0644\u0645\u0624\u0646\u062B \u0627\u0644\u0633\u0627\u0644\u0645 is broader: female humans, many feminine nouns, and many borrowed or long words (\u0633\u064E\u064A\u0651\u0627\u0631\u0627\u062A\u060C \u0627\u0650\u0645\u0652\u062A\u0650\u062D\u0627\u0646\u0627\u062A). Most everyday nouns take a broken plural, which you learn with the word (and in Chapter 8 through its pattern).

**Why two endings for the dual and sound plural?** These are i\u02BFr\u0101b: \u0640\u0627\u0646\u0650 / \u0640\u064F\u0648\u0646\u064E are the raf\u02BF forms, \u0640\u064E\u064A\u0652\u0646\u0650 / \u0640\u0650\u064A\u0646\u064E the na\u1E63b and jarr forms. They are your first glimpse of the substitute signs in Subject 2.5.`},{kind:"text",heading:"Egyptian bridge",body:`Egyptian froze the dual and the sound masculine plural in their \u0640\u064A\u0646 forms: \u0643\u062A\u0627\u0628\u064A\u0646\u060C \u0645\u062F\u0631\u0633\u064A\u0646\u060C \u0645\u0647\u0646\u062F\u0633\u064A\u0646. That\u2019s the Fu\u1E63\u1E25\u0101 na\u1E63b/jarr shape, used everywhere. The Fu\u1E63\u1E25\u0101 raf\u02BF forms (\u0640\u0627\u0646\u0650\u060C \u0640\u064F\u0648\u0646\u064E) are the ones you have to learn fresh.

Egyptian also uses the dual far less for adjectives and verbs: \u0627\u0644\u0648\u0644\u062F\u064A\u0646 \u0631\u0627\u062D\u0648\u0627 uses a plural verb, where Fu\u1E63\u1E25\u0101 says \u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0648\u064E\u0644\u064E\u062F\u0627\u0646\u0650. And Egyptian often gives \u0640\u064A\u0646 plural adjectives to feminine plurals (\u0627\u0644\u0628\u0646\u0627\u062A \u0634\u0627\u0637\u0631\u064A\u0646) where Fu\u1E63\u1E25\u0101 requires \u0634\u0627\u0637\u0650\u0631\u0627\u062A / \u0645\u064F\u062C\u0652\u062A\u064E\u0647\u0650\u062F\u0627\u062A.`},{kind:"examples",heading:"In the Qur\u2019an",items:[{ar:"\uFD3F\u0647\u064E\u0670\u0630\u064E\u0627\u0646\u0650 \u062E\u064E\u0635\u0652\u0645\u064E\u0627\u0646\u0650 \u0627\u062E\u0652\u062A\u064E\u0635\u064E\u0645\u064F\u0648\u0627 \u0641\u0650\u064A \u0631\u064E\u0628\u0650\u0651\u0647\u0650\u0645\u0652\uFD3E",ref:"S\u016Brat al-\u1E24ajj 22:19",en:"These are two opponents who dispute about their Lord.",note:"\u0647\u0670\u0630\u0627\u0646\u0650 and \u062E\u064E\u0635\u0652\u0645\u0627\u0646\u0650 are duals in raf\u02BF (\u0640\u0627\u0646\u0650)."},{ar:"\uFD3F\u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E\uFD3E",ref:"S\u016Brat al-Mu\u02BEmin\u016Bn 23:1",en:"The believers have certainly succeeded.",note:"\u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E: sound masculine plural, raf\u02BF as the \u0641\u0627\u0639\u0644."},{ar:"\uFD3F\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u064A\u0646\u064E \u0648\u064E\u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064E\u0627\u062A\u0650\uFD3E",ref:"S\u016Brat al-A\u1E25z\u0101b 33:35 (opening)",en:"Indeed, the Muslim men and Muslim women\u2026",note:"\u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u064A\u06
